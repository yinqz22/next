const XSVG = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const loc = () => LOCALE[lang] || 'de-DE';
const sortA = (a, b) => (a.d + a.time).localeCompare(b.d + b.time);
const dueMs = a => new Date(a.d + 'T' + a.time).getTime();

function saveLocal(){ try { localStorage.setItem(calKey(), JSON.stringify(cal.appts)); } catch(e){} }
function loadLocal(){ try { cal.appts = JSON.parse(localStorage.getItem(calKey()) || '[]'); } catch(e){ cal.appts = []; } }
const rowOut = a => ({ id:a.id, user_id:currentUser.id, title:a.t, day:a.d, at_time:a.time, done:a.done, notified:a.n });
async function remote(fn){ if (!cal.remote || !currentUser) return; try { const r = await fn(); if (r && r.error) cal.remote = false; } catch(e){} }
async function initCal(){
  const n = new Date(), me = currentUser.id;
  cal.y = n.getFullYear(); cal.m = n.getMonth(); cal.sel = null; cal.open = cal.moving = null; cal.remote = true;
  loadLocal(); renderCal();
  try {
    const { data, error } = await sb.from('appointments').select('id,title,day,at_time,done,notified').eq('user_id', me);
    if (error) { cal.remote = false; return; }
    if (!currentUser || currentUser.id !== me) return;
    cal.appts = data.map(r => ({ id:r.id, t:r.title, d:r.day, time:String(r.at_time).slice(0, 5), done:r.done, n:r.notified }));
    saveLocal(); renderCal(); checkDue();
  } catch(e){}
}
function update(a){ saveLocal(); remote(() => sb.from('appointments').upsert(rowOut(a))); }
function addAppts(list){
  const fresh = list.map(x => { const a = { id:(crypto.randomUUID ? crypto.randomUUID() : 'l' + Date.now() + Math.random()), t:x.t, d:cal.sel, time:x.time, done:false, n:false }; a.n = Date.now() - dueMs(a) > 5 * 60e3; return a; });
  cal.appts.push(...fresh); saveLocal();
  remote(() => sb.from('appointments').upsert(fresh.map(rowOut)));
}
function removeAppt(id){
  cal.appts = cal.appts.filter(a => a.id !== id); saveLocal();
  remote(() => sb.from('appointments').delete().eq('id', id));
}

function selectDay(s){ cal.sel = s; cal.open = cal.moving = null; renderCal(); const sh = $('#cal-sheet'); if (sh) sh.scrollTop = 0; }
function closeDay(){ cal.sel = null; cal.open = cal.moving = null; $('#cal-grid').classList.remove('sel'); $('#cal-side').classList.remove('show'); renderCal(); }
function shiftMonth(d){ cal.m += d; if (cal.m < 0) { cal.m = 11; cal.y--; } if (cal.m > 11) { cal.m = 0; cal.y++; } renderCal(); }
$('#cal-prev').onclick = () => shiftMonth(-1);
$('#cal-next').onclick = () => shiftMonth(1);
const phoneMQ = matchMedia('(max-width:760px)');
function placeSide(){
  const s = $('#cal-side'), ph = phoneMQ.matches;
  s.classList.toggle('phone', ph);
  if (ph && s.parentNode !== document.body) document.body.append(s);
  if (!ph && s.parentNode === document.body) $('#cal-grid').append(s);
}
phoneMQ.addEventListener('change', () => { placeSide(); renderCal(); });
placeSide();
$('#cal-side').addEventListener('click', e => { if (e.target.id === 'cal-side') closeDay(); });

function toggleYears(on){
  cal.yrOpen = on; $('#yr-wrap').classList.toggle('open', on); $('#cal-year').setAttribute('aria-expanded', String(on));
  if (!on) return;
  const ul = $('#yr-list'); ul.textContent = '';
  for (let y = 1970; y <= 2100; y++) {
    const li = el('li', '', String(y)); li.setAttribute('role', 'option'); li.setAttribute('aria-selected', String(y === cal.y));
    li.onclick = () => { cal.y = y; toggleYears(false); renderCal(); };
    ul.append(li);
  }
  const s = ul.querySelector('[aria-selected=true]'); if (s) ul.scrollTop = s.offsetTop - ul.clientHeight / 2 + 16;
}
$('#cal-year').onclick = () => toggleYears(!cal.yrOpen);
document.addEventListener('click', e => { if (cal.yrOpen && !e.target.closest('#yr-wrap')) toggleYears(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (cal.yrOpen) toggleYears(false); else if (cal.sel && view === 'cal' && !ov.classList.contains('open')) closeDay(); } });

function renderCal(){
  if (!currentUser) return;
  const now = new Date(), todayS = ymd(now);
  $('#cal-day').textContent = now.getDate();
  $('#cal-wd').textContent = now.toLocaleDateString(loc(), { weekday:'long' });
  $('#cal-month').textContent = new Date(cal.y, cal.m, 1).toLocaleDateString(loc(), { month:'long' });
  $('#cal-year').textContent = cal.y;
  const wds = $('#cal-wds'); wds.textContent = '';
  for (let i = 0; i < 7; i++) {
    const s = new Date(2024, 0, 1 + i).toLocaleDateString(loc(), { weekday:'short' }).replace(/\./g, '');
    wds.append(el('span', '', lang === 'ar' ? s : s.slice(0, 2)));
  }
  const lead = (new Date(cal.y, cal.m, 1).getDay() + 6) % 7, dim = new Date(cal.y, cal.m + 1, 0).getDate();
  const map = {}; cal.appts.forEach(a => (map[a.d] = map[a.d] || []).push(a));
  const grid = $('#cal-days'); grid.textContent = '';
  for (let i = 0; i < lead; i++) grid.append(el('span'));
  for (let d = 1; d <= dim; d++) {
    const s = cal.y + '-' + pad(cal.m + 1) + '-' + pad(d), list = map[s] || [];
    const b = el('button', 'cal-day' + (s < todayS ? ' past' : '') + (s === todayS ? ' today' : '') + (s === cal.sel ? ' sel' : '')); b.type = 'button';
    b.append(el('span', 'n', String(d)));
    if (list.length) {
      const dots = el('span', 'cal-dots' + (list.every(a => a.done) ? ' alldone' : ''));
      for (let k = 0; k < Math.min(list.length, 3); k++) dots.append(el('i'));
      b.append(dots);
    }
    b.onclick = () => selectDay(s);
    grid.append(b);
  }
  const prefix = cal.y + '-' + pad(cal.m + 1), mine = cal.appts.filter(a => a.d.startsWith(prefix)).sort(sortA);
  $('#cal-count').textContent = mine.length;
  const ml = $('#month-list'); ml.textContent = '';
  mine.slice(0, 5).forEach(a => {
    const b = el('button', 'cal-li' + (a.done ? ' done' : '')); b.type = 'button';
    b.append(el('span', 'dt', new Date(a.d + 'T00:00').toLocaleDateString(loc(), { day:'numeric', month:'short' })), el('span', 'cal-tt', a.t), el('span', 'cal-tm', a.time));
    b.onclick = () => selectDay(a.d); ml.append(b);
  });
  if (mine.length > 5) ml.append(el('div', 'cal-more', t('more_n', { n: mine.length - 5 })));
  if (!mine.length) ml.append(el('div', 'cal-more', t('no_appts')));
  $('#cal-grid').classList.toggle('sel', !!cal.sel); $('#cal-side').classList.toggle('show', !!cal.sel);
  renderSide();
}

function renderSide(){
  if (!cal.sel) return;
  const box = $('#cal-sheet'); box.textContent = '';
  const date = new Date(cal.sel + 'T00:00');
  const head = el('div', 'cal-ph'); head.append(el('b', '', date.toLocaleDateString(loc(), { weekday:'long', day:'numeric', month:'long' })));
  const x = el('button', 'icon-btn circle cal-x'); x.type = 'button'; x.innerHTML = XSVG; x.setAttribute('aria-label', t('close')); x.onclick = closeDay; head.append(x);

  // + Create
  const cr = el('div', 'cal-create'); cr.append(el('h4', '', '+ ' + t('create')));
  const rows = el('div', 'cal-rows'); cr.append(rows);
  const defTime = () => cal.sel === ymd(new Date()) ? pad((new Date().getHours() + 1) % 24) + ':00' : '09:00';
  const addRow = focus => {
    const r = el('div', 'cal-r');
    const n = el('input', 'inp'); n.type = 'text'; n.maxLength = 80; n.placeholder = t('ap_name'); n.autocomplete = 'off';
    const tm = el('input', 'inp'); tm.type = 'time'; tm.value = defTime(); tm.setAttribute('aria-label', t('ap_time'));
    const rm = el('button', 'reveal'); rm.type = 'button'; rm.innerHTML = XSVG; rm.setAttribute('aria-label', t('del'));
    rm.onclick = () => { if (rows.children.length > 1) { r.remove(); rows.classList.toggle('multi', rows.children.length > 1); } };
    r.append(n, tm, rm); rows.append(r); rows.classList.toggle('multi', rows.children.length > 1);
    if (focus) n.focus();
  };
  addRow(false);
  const more = el('button', 'link', '+ ' + t('add_row')); more.type = 'button'; more.onclick = () => addRow(true);
  const ok = el('button', 'primary', t('add_btn')); ok.type = 'button';
  ok.onclick = () => {
    const list = [...rows.children].map(r => ({ t: r.children[0].value.trim().replace(/\s+/g, ' '), time: r.children[1].value || '09:00' })).filter(a => a.t);
    if (!list.length) { rows.children[0].children[0].focus(); return toast(t('name_empty'), true); }
    addAppts(list); askNotify(); toast(t('added')); cal.open = null; renderCal();
  };
  cr.append(more, ok);

  // Activity-Balken
  const day = cal.appts.filter(a => a.d === cal.sel).sort(sortA);
  const pct = day.length ? Math.round(day.filter(a => a.done).length / day.length * 100) : 0;
  const act = el('div', 'act'), fill = el('i', 'act-fill'), at = el('div', 'act-t');
  at.append(el('span', '', t('activity')), el('small', '', '(' + pct + '%)')); act.append(fill, at);
  requestAnimationFrame(() => requestAnimationFrame(() => fill.style.width = pct + '%'));

  // Termine des Tages
  const its = el('div', 'cal-its');
  if (!day.length) its.append(el('div', 'cal-more', t('no_appts_day')));
  day.forEach(a => {
    const it = el('div', 'cal-it' + (a.done ? ' done' : ''));
    const b = el('button', 'cal-it-b'); b.type = 'button';
    const chk = el('span', 'cal-chk'); if (a.done) chk.innerHTML = CHECK;
    b.append(chk, el('span', 'cal-tm', a.time), el('span', 'cal-tt', a.t));
    b.onclick = () => { cal.open = cal.open === a.id ? null : a.id; cal.moving = null; renderSide(); };
    it.append(b);
    if (cal.open === a.id) {
      const acts = el('div', 'cal-acts');
      if (cal.moving === a.id) {
        const di = el('input', 'inp'); di.type = 'date'; di.value = a.d;
        const ti = el('input', 'inp'); ti.type = 'time'; ti.value = a.time;
        const sv = el('button', 'primary', t('ok_move')); sv.type = 'button';
        sv.onclick = () => {
          a.d = di.value || a.d; a.time = ti.value || a.time; a.n = Date.now() - dueMs(a) > 5 * 60e3;
          update(a); cal.moving = null; cal.sel = a.d;
          const nd = new Date(a.d + 'T00:00'); cal.y = nd.getFullYear(); cal.m = nd.getMonth(); renderCal();
        };
        const cc = el('button', 'ghost', t('cancel')); cc.type = 'button'; cc.onclick = () => { cal.moving = null; renderSide(); };
        acts.append(di, ti, sv, cc);
      } else {
        const dn = el('button', 'ghost', a.done ? t('undo') : t('mark_done')); dn.type = 'button';
        dn.onclick = () => { a.done = !a.done; update(a); renderCal(); };
        const mv = el('button', 'ghost', t('move')); mv.type = 'button'; mv.onclick = () => { cal.moving = a.id; renderSide(); };
        const dl = el('button', 'danger-ghost', t('del')); dl.type = 'button';
        dl.onclick = () => { removeAppt(a.id); cal.open = null; renderCal(); };
        acts.append(dn, mv, dl);
      }
      it.append(acts);
    }
    its.append(it);
  });
  box.append(head, cr, act, its);
}

/* Erinnerungen: wenn es soweit ist, kommt "Heute: <Name>" in die Glocke, als Hinweis und (falls erlaubt) als Systemmeldung */
function askNotify(){ if ('Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch(e){} } }
function fireNote(a){
  const title = t('today') + ': ' + a.t;
  notes.unshift({ text: title + ' \u00b7 ' + a.time, read:false }); renderNotes(); toast(title);
  try { navigator.vibrate && navigator.vibrate([180, 80, 180]); } catch(e){}
  if ('Notification' in window && Notification.permission === 'granted') {
    const o = { body: a.time, icon:'icon-192.png', badge:'icon-192.png', tag:'ap-' + a.id };
    const direct = () => { try { new Notification(title, o); } catch(e){} };
    if (navigator.serviceWorker) navigator.serviceWorker.ready.then(r => r.showNotification(title, o)).catch(direct); else direct();
  }
}
function checkDue(){
  if (!currentUser) return;
  const now = Date.now();
  cal.appts.forEach(a => {
    if (a.done || a.n || dueMs(a) > now) return;
    a.n = true; if (now - dueMs(a) < 12 * 3600e3) fireNote(a); update(a);
  });
}
setInterval(checkDue, 5000);
window.addEventListener('focus', checkDue); window.addEventListener('pageshow', checkDue);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDue(); });

/* ---------- Tasks & Goals ---------- */
const tk = { items:[], goals:[], notes:{}, range:'today', gk:'monthly', remote:true };
const tkKey = n => 'next.' + n + '.' + (currentUser ? currentUser.id : '');
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
function tkSave(){
  try {
    localStorage.setItem(tkKey('tasks'), JSON.stringify(tk.items));
    localStorage.setItem(tkKey('goals'), JSON.stringify(tk.goals));
    localStorage.setItem(tkKey('gnotes'), JSON.stringify(tk.notes));
  } catch(e){}
}
function tkLoad(){
  const g = (n, d) => { try { return JSON.parse(localStorage.getItem(tkKey(n)) || d); } catch(e){ return JSON.parse(d); } };
  tk.items = g('tasks', '[]'); tk.goals = g('goals', '[]'); tk.notes = g('gnotes', '{}');
}
async function tkRemote(fn){ if (!tk.remote || !currentUser) return; try { const r = await fn(); if (r && r.error) tk.remote = false; } catch(e){} }
const taskRow = a => ({ id:a.id, user_id:currentUser.id, title:a.t, day:a.d, done:a.done, done_at:a.at ? new Date(a.at).toISOString() : null, created_at:new Date(a.c).toISOString() });
const goalRow = g => ({ id:g.id, user_id:currentUser.id, kind:g.k, period:g.p, text:g.t, done:g.done });

async function initTasks(){
  const me = currentUser.id;
  tk.range = 'today'; tk.gk = 'monthly'; tk.remote = true;
  tkLoad(); renderTasks();
  try {
    const [a, b, c] = await Promise.all([
      sb.from('tasks').select('id,title,day,done,done_at,created_at').eq('user_id', me),
      sb.from('goals').select('id,kind,period,text,done').eq('user_id', me),
      sb.from('goal_notes').select('kind,period,body').eq('user_id', me)
    ]);
    if (a.error || b.error || c.error) { tk.remote = false; return; }
    if (!currentUser || currentUser.id !== me) return;
    tk.items = a.data.map(r => ({ id:r.id, t:r.title, d:r.day, done:r.done, at:r.done_at ? Date.parse(r.done_at) : null, c:Date.parse(r.created_at) }));
    tk.goals = b.data.map(r => ({ id:r.id, k:r.kind, p:r.period, t:r.text, done:r.done }));
    tk.notes = {}; c.data.forEach(r => tk.notes[r.kind + ':' + r.period] = r.body);
    tkSave(); renderTasks();
  } catch(e){}
}

/* ----- Auswertung ----- */
const tkOpen = ts => tk.items.filter(x => !x.done && x.d <= ts);
const tkUp = ts => tk.items.filter(x => !x.done && x.d > ts);
function weekStart(now){ const m = new Date(now.getFullYear(), now.getMonth(), now.getDate()); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
function tkStats(range){
  const now = new Date(), ts = ymd(now), ws = weekStart(now), we = new Date(ws); we.setDate(ws.getDate() + 6);
  const dOf = x => ymd(new Date(x.at));
  const doneAll = tk.items.filter(x => x.done);
  if (range === 'today') return { done: doneAll.filter(x => x.at && dOf(x) === ts).length, left: tkOpen(ts).length, up: tkUp(ts).length };
  if (range === 'week') return { done: doneAll.filter(x => x.at && dOf(x) >= ymd(ws) && dOf(x) <= ymd(we)).length, left: tkOpen(ts).length, up: tkUp(ts).filter(x => x.d <= ymd(we)).length };
  return { done: doneAll.length, left: tkOpen(ts).length, up: tkUp(ts).length };
}
function tkSeries(range){
  const now = new Date(), ts = ymd(now), items = tk.items, B = [];
  const dOf = x => ymd(new Date(x.at));
  if (range === 'today') {
    const H = now.getHours();
    const doneT = items.filter(x => x.done && x.at && dOf(x) === ts);
    const openN = tkOpen(ts).length, upN = tkUp(ts).length;
    for (let h = 0; h < 24; h++) {
      const dn = doneT.filter(x => new Date(x.at).getHours() <= h).length;
      B.push({ l: pad(h) + ':00', done: h <= H ? dn : null, open: h <= H ? openN + doneT.length - dn : null, up: h >= H ? upN : null });
    }
    return { B, nowI: H, skip: 4 };
  }
  const mk = (k, l, i, nowI) => ({
    l,
    done: i <= nowI ? items.filter(x => x.done && x.at && dOf(x).startsWith(k)).length : null,
    open: i <= nowI ? items.filter(x => !x.done && x.d.startsWith(k) && x.d <= ts).length : null,
    up: i >= nowI ? items.filter(x => !x.done && x.d.startsWith(k) && x.d > ts).length : null
  });
  if (range === 'week') {
    const ws = weekStart(now), nowI = (now.getDay() + 6) % 7;
    for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); B.push(mk(ymd(d), d.toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' }), i, nowI)); }
    return { B, nowI, skip: 1 };
  }
  for (let i = -8; i <= 3; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    B.push(mk(d.getFullYear() + '-' + pad(d.getMonth() + 1), d.toLocaleDateString(loc(), { month:'short', year:'numeric' }), i + 8, 8));
  }
  return { B, nowI: 8, skip: 2 };
}
function smoothPath(pts, lo, hi){
  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  const cl = y => Math.min(hi, Math.max(lo, y));
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + cl(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' +
      (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + cl(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
  }
  return d;
}
function drawChart(range){
  const { B, nowI, skip } = tkSeries(range), n = B.length;
  const W = 640, H = 250, pl = 30, pr = 16, pt = 16, pb = 28, base = H - pb;
  let mx = 0; B.forEach(p => ['done', 'open', 'up'].forEach(k => { if (p[k] != null) mx = Math.max(mx, p[k]); }));
  const step = Math.max(1, Math.ceil(mx / 4)), top = step * 4;
  const X = i => pl + i * (W - pl - pr) / (n - 1), Y = v => pt + (1 - v / top) * (base - pt);
  const defs = [['done', 'c-done', 'dc-done', 'tk_done'], ['open', 'c-open', 'dc-open', 'tk_left'], ['up', 'c-up', 'dc-up', 'tk_up']];
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img"><defs><linearGradient id="tkg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.32"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>';
  for (let g = 0; g <= 4; g++) {
    const y = Y(g * step).toFixed(1);
    s += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pl - 8) + '" y="' + (+y + 4) + '" text-anchor="end">' + (g * step) + '</text>';
  }
  B.forEach((p, i) => { if (i % skip === 0) s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + p.l + '</text>'; });
  s += '<line class="nowl" x1="' + X(nowI).toFixed(1) + '" x2="' + X(nowI).toFixed(1) + '" y1="' + pt + '" y2="' + base + '"/>';
  defs.forEach(([k, lc, dc]) => {
    const pts = []; B.forEach((p, i) => { if (p[k] != null) pts.push([X(i), Y(p[k])]); });
    if (!pts.length) return;
    if (pts.length > 1) {
      const d = smoothPath(pts, pt, base);
      if (k === 'done') s += '<path class="area" fill="url(#tkg)" d="' + d + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + base + ' L' + pts[0][0].toFixed(1) + ' ' + base + ' Z"/>';
      s += '<path class="ln ' + lc + '" pathLength="1" d="' + d + '"/>';
    }
    const e = pts[k === 'up' ? 0 : pts.length - 1];
    s += '<circle class="endp ' + dc + '" cx="' + e[0].toFixed(1) + '" cy="' + e[1].toFixed(1) + '" r="4.5"/>';
  });
  s += '<g class="hv"><line class="hl" y1="' + pt + '" y2="' + base + '"/>' + defs.map(d => '<circle class="' + d[2] + '" r="5" data-k="' + d[0] + '"/>').join('') + '</g>';
  s += '<rect class="hit" x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent"/></svg><div class="t-tip"></div>';
  const box = $('#tk-chart'); box.classList.remove('hov'); box.innerHTML = s;
  const svg = box.querySelector('svg'), tip = box.querySelector('.t-tip'), hl = svg.querySelector('.hl');
  const move = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((x - pl) / ((W - pl - pr) / (n - 1)))));
    const px = X(i), p = B[i];
    hl.setAttribute('x1', px); hl.setAttribute('x2', px);
    svg.querySelectorAll('.hv circle').forEach(c => {
      const v = p[c.dataset.k];
      c.style.display = v == null ? 'none' : ''; if (v != null) { c.setAttribute('cx', px); c.setAttribute('cy', Y(v)); }
    });
    tip.textContent = ''; tip.append(el('b', '', p.l));
    defs.forEach(([k, , dc, tkey]) => {
      if (p[k] == null) return;
      const row = el('div'); const dot = el('i'); dot.style.background = getComputedStyle(svg.querySelector('.' + dc)).fill;
      row.append(dot, el('span', '', t(tkey)), el('em', '', String(p[k]))); tip.append(row);
    });
    const pct = Math.min(82, Math.max(18, px / W * 100)); tip.style.left = pct + '%';
    box.classList.add('hov');
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => box.classList.remove('hov'));
}
function renderSummary(){
  $('#tk-seg').style.setProperty('--i', { today:0, week:1, all:2 }[tk.range]);
  document.querySelectorAll('#tk-seg button').forEach(b => b.classList.toggle('on', b.dataset.v === tk.range));
  const st = tkStats(tk.range);
  $('#tk-n-done').textContent = st.done; $('#tk-n-left').textContent = st.left; $('#tk-n-up').textContent = st.up;
  drawChart(tk.range);
}
document.querySelectorAll('#tk-seg button').forEach(b => b.onclick = () => { tk.range = b.dataset.v; renderSummary(); });

/* ----- Karten ----- */
const DOTS = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';
const CHECK_PATH = '<svg class="t-bi" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg>';
function closeTkMenus(except){ document.querySelectorAll('.t-menu.open').forEach(m => { if (m !== except) m.classList.remove('open'); }); }
document.addEventListener('click', () => closeTkMenus());
function burst(btn){
  const b = el('span', 'burst');
  for (let i = 0; i < 10; i++) { const p = el('i'); p.style.setProperty('--a', i * 36); b.append(p); }
  btn.append(b); setTimeout(() => b.remove(), 800);
}
function renderToday(){
  const ts = ymd(new Date()), day = tk.items.filter(x => x.d === ts);
  $('#tk-today-n').textContent = day.length;
  $('#tk-today-sub').textContent = day.filter(x => x.done).length + ' / ' + day.length + ' \u2713';
}
function taskCard(a){
  const ts = ymd(new Date());
  const c = el('div', 't-card' + (a.done ? ' done' : ''));
  const top = el('div', 't-top');
  const badge = el('span', 't-badge'); badge.innerHTML = CHECK_PATH;
  const dots = el('button', 'icon-btn t-dots'); dots.type = 'button'; dots.innerHTML = DOTS; dots.setAttribute('aria-label', t('tk_more'));
  const menu = el('div', 'pop t-menu');
  const del = el('button', 'row danger', t('del')); del.type = 'button';
  menu.append(del);
  dots.onclick = e => { e.stopPropagation(); closeTkMenus(menu); menu.classList.toggle('open'); };
  menu.onclick = e => e.stopPropagation();
  del.onclick = () => {
    menu.classList.remove('open');
    openDialog({ title: t('tk_del_title'), text: t('tk_del_text'), okKey: 'del', danger: true,
      onOk: async () => { tk.items = tk.items.filter(x => x.id !== a.id); tkSave(); tkRemote(() => sb.from('tasks').delete().eq('id', a.id)); renderTasks(); } });
  };
  top.append(badge, dots, menu);
  const title = el('div', 't-title', a.t);
  const date = el('div', 't-date' + (!a.done && a.d < ts ? ' late' : ''), a.d === ts ? t('today') : new Date(a.d + 'T00:00').toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' }));
  const btn = el('button', 't-btn' + (a.done ? ' on' : '')); btn.type = 'button';
  btn.innerHTML = CHECK_PATH; const lbl = el('span', '', t(a.done ? 'tk_unmark' : 'tk_mark')); btn.append(lbl);
  btn.onclick = () => {
    a.done = !a.done; a.at = a.done ? Date.now() : null;
    c.classList.toggle('done', a.done); btn.classList.toggle('on', a.done);
    lbl.textContent = t(a.done ? 'tk_unmark' : 'tk_mark');
    date.classList.toggle('late', !a.done && a.d < ts);
    btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
    if (a.done) burst(btn);
    tkSave(); tkRemote(() => sb.from('tasks').upsert(taskRow(a)));
    renderToday(); renderSummary();
  };
  c.append(top, title, date, btn);
  return c;
}
function renderGrid(){
  const g = $('#tk-grid'); g.textContent = '';
  const list = [...tk.items].sort((a, b) => (a.done - b.done) || a.d.localeCompare(b.d) || (a.c - b.c));
  if (!list.length) { g.append(el('div', 'cal-more', t('tk_none'))); return; }
  list.forEach(a => g.append(taskCard(a)));
}

/* ----- Neue Aufgabe ----- */
const tov = $('#task-ov'), tName = $('#tk-name'), tDate = $('#tk-date'), tErr = $('#tk-err');
let tLast = null;
function openTaskDlg(){
  tLast = document.activeElement; tName.value = ''; tDate.value = ymd(new Date()); tErr.textContent = '';
  tov.classList.add('open'); tov.setAttribute('aria-hidden', 'false'); setTimeout(() => tName.focus(), 80);
}
function closeTaskDlg(){
  if (!tov.classList.contains('open')) return;
  tov.classList.remove('open'); tov.setAttribute('aria-hidden', 'true');
  if (tLast && tLast.focus && document.contains(tLast)) tLast.focus();
}
function submitTask(){
  const name = tName.value.trim().replace(/\s+/g, ' ');
  if (!name) { tErr.textContent = t('name_empty'); tName.focus(); return; }
  const a = { id: uuid(), t: name, d: tDate.value || ymd(new Date()), done: false, at: null, c: Date.now() };
  tk.items.push(a); tkSave(); tkRemote(() => sb.from('tasks').upsert(taskRow(a)));
  closeTaskDlg(); renderTasks(); toast(t('tk_added'));
}
$('#tk-new').onclick = openTaskDlg;
$('#tk-cancel').onclick = closeTaskDlg;
$('#tk-ok').onclick = submitTask;
tName.addEventListener('keydown', e => { if (e.key === 'Enter') submitTask(); });
tov.addEventListener('click', e => { if (e.target === tov) closeTaskDlg(); });

/* ----- Ziele ----- */
function gPeriod(){ const n = new Date(); return tk.gk === 'monthly' ? n.getFullYear() + '-' + pad(n.getMonth() + 1) : String(n.getFullYear()); }
function goalItem(g){
  const r = el('div', 'g-it' + (g.done ? ' done' : ''));
  const chk = el('button', 'g-chk'); chk.type = 'button'; chk.setAttribute('aria-pressed', String(g.done));
  chk.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg>';
  const tx = el('span', 'g-tt', g.t);
  const x = el('button', 'reveal g-del'); x.type = 'button'; x.innerHTML = XSVG; x.setAttribute('aria-label', t('del'));
  const toggle = () => {
    g.done = !g.done; r.classList.toggle('fx', g.done); r.classList.toggle('done', g.done); chk.setAttribute('aria-pressed', String(g.done));
    tkSave(); tkRemote(() => sb.from('goals').upsert(goalRow(g)));
  };
  chk.onclick = toggle; tx.onclick = toggle;
  x.onclick = () => { tk.goals = tk.goals.filter(y => y.id !== g.id); tkSave(); tkRemote(() => sb.from('goals').delete().eq('id', g.id)); renderGoals(); };
  r.append(chk, tx, x);
  return r;
}
function renderGoals(){
  $('#gl-seg').style.setProperty('--i', tk.gk === 'monthly' ? 0 : 1);
  document.querySelectorAll('#gl-seg button').forEach(b => b.classList.toggle('on', b.dataset.v === tk.gk));
  const p = gPeriod(), now = new Date();
  $('#gl-period').textContent = tk.gk === 'monthly' ? now.toLocaleDateString(loc(), { month:'long', year:'numeric' }) : String(now.getFullYear());
  const list = $('#gl-list'); list.textContent = '';
  const mine = tk.goals.filter(g => g.k === tk.gk && g.p === p);
  if (!mine.length) list.append(el('div', 'cal-more', t('gl_none')));
  mine.forEach(g => list.append(goalItem(g)));
  $('#gl-notes').value = tk.notes[tk.gk + ':' + p] || '';
}
document.querySelectorAll('#gl-seg button').forEach(b => b.onclick = () => { tk.gk = b.dataset.v; renderGoals(); });
function addGoal(){
  const inp = $('#gl-in'), text = inp.value.trim().replace(/\s+/g, ' ');
  if (!text) { inp.focus(); return; }
  const g = { id: uuid(), k: tk.gk, p: gPeriod(), t: text.slice(0, 120), done: false };
  tk.goals.push(g); tkSave(); tkRemote(() => sb.from('goals').upsert(goalRow(g)));
  inp.value = ''; renderGoals(); inp.focus();
}
$('#gl-add').onclick = addGoal;
$('#gl-in').addEventListener('keydown', e => { if (e.key === 'Enter') addGoal(); });
let noteT;
$('#gl-notes').addEventListener('input', e => {
  const kk = tk.gk, pp = gPeriod(), v = e.target.value.slice(0, 4000);
  tk.notes[kk + ':' + pp] = v; tkSave(); clearTimeout(noteT);
  noteT = setTimeout(() => tkRemote(() => sb.from('goal_notes').upsert({ user_id: currentUser.id, kind: kk, period: pp, body: v }, { onConflict: 'user_id,kind,period' })), 700);
});

function renderTasks(){
  if (!currentUser) return;
  renderToday(); renderGrid(); renderSummary(); renderGoals();
}

/* ---------- Kopier- und Ziehschutz (Eingabefelder bleiben nutzbar) ---------- */
const inField = e => e.target.closest && e.target.closest('input,textarea');
['contextmenu','dragstart','selectstart','copy','cut'].forEach(ev =>
  document.addEventListener(ev, e => { if (!inField(e)) e.preventDefault(); }));
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['c','x','s','u','p','a'].includes(k) && !inField(e)) e.preventDefault();
});

/* ---------- Handy-Dock ---------- */
const dock = $('#dock');
function setDock(min){
  dock.classList.toggle('min', min); $('#dock-logo').setAttribute('aria-expanded', String(!min));
  try { localStorage.setItem('next.dock', min ? '1' : '0'); } catch(e){}
}
try { if (localStorage.getItem('next.dock') === '1') dock.classList.add('min'); } catch(e){}
$('#dock-logo').onclick = () => setDock(!dock.classList.contains('min'));
document.querySelectorAll('.dock-btn').forEach(b => b.onclick = () => go(b.dataset.view));
/* Zoomen sperren (iOS ignoriert user-scalable) */
['gesturestart','gesturechange','gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });

/* ---------- Start ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
initSide();
applyI18n();
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && document.body.classList.contains('in')) showLogin(); });
sb.auth.getSession().then(({ data }) => { if (data.session) showApp(data.session.user); });
</script>
</body>
</html>
