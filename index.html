<script>
(function(){
  var KEY = 'next.prefs.v13';
  var DEF = { theme:'dark', custom:false, main:'#0a1812', second:'#46d28f', lang:'en', emailVisible:false };
  var HEX = /^#[0-9a-f]{6}$/i;
  function lumi(h){
    var m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return 0;
    var n = parseInt(m[1], 16);
    function f(c){ c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }
    return .2126 * f(n >> 16) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);
  }
  window.Prefs = {
    DEF: DEF, lumi: lumi,
    clean: function(p){
      var o = Object.assign({}, DEF, p || {});
      if (['light','dark','system'].indexOf(o.theme) < 0) o.theme = DEF.theme;
      if (!HEX.test(o.main)) o.main = DEF.main;
      if (!HEX.test(o.second)) o.second = DEF.second;
      if (['de','en','ar'].indexOf(o.lang) < 0) o.lang = DEF.lang;
      o.custom = !!o.custom; o.emailVisible = !!o.emailVisible;
      return o;
    },
    load: function(){ try { return this.clean(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ return this.clean(); } },
    store: function(p){ try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){} },
    apply: function(p){
      var r = document.documentElement, props = ['--bg','--text','--accent','--accent-ink','--accent-text'];
      if (p.custom) {
        var scheme = lumi(p.main) > .4 ? 'light' : 'dark';
        r.dataset.scheme = scheme; r.dataset.custom = '1';
        r.style.setProperty('--bg', p.main);
        r.style.setProperty('--text', scheme === 'light' ? 'color-mix(in srgb, var(--bg) 16%, #0d0d0d)' : 'color-mix(in srgb, var(--bg) 12%, #ffffff)');
        r.style.setProperty('--accent', p.second);
        r.style.setProperty('--accent-text', scheme === 'light' ? 'color-mix(in srgb, var(--accent) 50%, #000000)' : p.second);
        r.style.setProperty('--accent-ink', lumi(p.second) > .42 ? '#0b0b0d' : '#ffffff');
      } else {
        delete r.dataset.custom;
        props.forEach(function(k){ r.style.removeProperty(k); });
        r.dataset.scheme = p.theme === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p.theme;
      }
    }
  };
  var p = Prefs.load();
  Prefs.apply(p);
  document.documentElement.lang = p.lang;
  document.documentElement.dir = p.lang === 'ar' ? 'rtl' : 'ltr';
})();
</script>

.ico{display:inline-block;flex:none;width:17px;height:17px;background:currentColor;-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
:root{
  --bg:#0a1812; --text:#e3efe6; --accent:#46d28f; --accent-ink:#06150d; --accent-text:var(--accent); --err:#ff7a7a;
  --panel:color-mix(in srgb,var(--bg),var(--text) 6%);
  --frame:color-mix(in srgb,var(--bg),var(--text) 3%);
  --line:color-mix(in srgb,var(--bg),var(--text) 14%);
  --muted:color-mix(in srgb,var(--text),var(--bg) 45%);
  --hover:color-mix(in srgb,var(--bg),var(--text) 9%);
  --pop:color-mix(in srgb,var(--bg),var(--text) 8%);
  --shadow:0 16px 36px rgba(0,0,0,.35);
  --sw:200px; --sc:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-scheme=light]{--shadow:0 14px 32px rgba(60,48,0,.16);color-scheme:light}
:root[data-scheme=light]:not([data-custom]){--bg:#fbf5d3;--text:#2b2508;--accent:#e9b800;--accent-ink:#2b2508;--accent-text:#8a6a00;--panel:#fffbe6;--frame:#fdf8dd}

*{box-sizing:border-box}
html{font-size:14px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque','Noto Sans Arabic',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:24px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:background-color .35s,color .35s}
@media (max-width:480px){body:not(.in){padding:16px}}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- login ---------- */
main{width:100%;max-width:370px;text-align:center}
.logo{display:block;width:60px;height:72px;margin:0 auto 24px;color:var(--accent)}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 24px;line-height:1.5}
form{display:grid;gap:11px;text-align:start}
label{font-size:.85rem;color:var(--muted)}
main input{width:100%;margin-top:6px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:1rem;transition:border-color .2s}
main input:focus{border-color:var(--accent);outline:none}
main input.code{text-align:center;font-size:1.6rem;font-weight:600;letter-spacing:.5em;padding-inline-start:calc(14px + .5em)}
button.primary{padding:12px 18px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1rem;cursor:pointer;transition:transform .15s var(--ease),opacity .2s,background .2s}
button.primary:hover{opacity:.9}
button.primary:active{transform:scale(.98)}
button.primary:disabled{opacity:.5;cursor:wait}
button.primary.danger{background:var(--err);color:#1a0606}
form button.primary{margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
button.oauth{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:1rem;cursor:pointer;transition:border-color .2s,transform .15s var(--ease)}
button.oauth:hover{border-color:color-mix(in srgb,var(--line),var(--text) 30%)}
button.oauth:active{transform:scale(.99)}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;color:var(--accent-text)}
.alt{margin-top:20px;color:var(--muted);font-size:.93rem}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.9rem;color:var(--err)}
.msg.ok{color:var(--text)}

/* ---------- app shell ---------- */
#app{display:none}
body.in{display:block;padding:0;overflow:hidden}
body.in main{display:none}
body.in #app{display:block}
.frame{--aw:var(--sw);--cs:calc(var(--aw) + 24px);position:fixed;inset:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));border:1px solid var(--line);border-radius:28px;background:var(--frame);overflow:hidden;transition:background-color .35s,border-color .35s}
body.collapsed .frame{--aw:var(--sc)}
aside{position:absolute;inset-inline-start:12px;top:12px;bottom:12px;width:var(--aw);padding:20px 10px;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:22px;z-index:20;transition:width .42s var(--ease),background-color .35s,border-color .35s,box-shadow .3s}
.brand{display:flex;align-items:center;gap:9px;width:100%;padding:2px calc((var(--sc) - 22px - 24px)/2) 22px;border:0;background:none;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;text-align:start;cursor:pointer;overflow:hidden;white-space:nowrap;transition:gap .4s var(--ease)}
.brand-ico{width:24px;height:29px;color:var(--accent);transition:transform .45s var(--ease)}
.brand:hover .brand-ico{transform:rotate(-8deg) scale(1.08)}
.navs{position:relative;display:grid;gap:4px}
.pill{position:absolute;inset-inline:0;top:0;height:0;border-radius:13px;background:var(--accent);transition:none;pointer-events:none}
.pill.ready{transition:transform .4s var(--ease),height .3s var(--ease),background-color .35s}
.nav,.side-toggle{position:relative;z-index:1;display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:0 calc((var(--sc) - 22px - 17px)/2);border:0;border-radius:13px;background:transparent;font-size:.93rem;font-weight:600;text-align:start;cursor:pointer;overflow:hidden;white-space:nowrap;transition:color .3s,background-color .2s,gap .4s var(--ease)}
.lbl{overflow:hidden;white-space:nowrap;max-width:150px;transition:opacity .25s,max-width .42s var(--ease)}
.nav:not(.active):hover,.side-toggle:hover{background:var(--hover)}
.nav.active{color:var(--accent-ink)}
.side-toggle{margin-top:auto;color:var(--muted)}
.side-toggle:hover{color:var(--text)}
.side-toggle svg{flex:none;width:17px;height:17px}
.side-toggle .out{display:none}
body.collapsed .side-toggle .in{display:none}
body.collapsed .side-toggle .out{display:inline}
body.collapsed .lbl{opacity:0;max-width:0}
body.collapsed .nav,body.collapsed .side-toggle,body.collapsed .brand{gap:0}
.scrim{display:none;position:absolute;inset:0;z-index:15;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}

.scroll{position:absolute;inset-block:0;inset-inline-start:var(--cs);inset-inline-end:0;overflow:auto;padding-block:22px 100px;padding-inline:8px 26px;transition:inset-inline-start .42s var(--ease);scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text),transparent 80%) transparent}
.greet{margin:0;font-size:clamp(1.4rem,2.4vw,1.9rem);font-weight:800;letter-spacing:-.03em;line-height:38px}
.greet .name{color:var(--accent-text)}

/* Tab-Wechsel */
.view.enter>*{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
.view.leave{opacity:0;transform:translateY(8px);transition:opacity .16s ease,transform .16s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- top tools ---------- */
.tools{position:absolute;top:22px;inset-inline-end:24px;display:flex;align-items:center;gap:10px;z-index:6}
.icon-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer;flex:none}
.icon-btn .ico{width:18px;height:18px}
.circle{background:var(--hover);border:1px solid var(--line);transition:background-color .2s,transform .15s var(--ease)}
.circle:hover{background:color-mix(in srgb,var(--hover),var(--text) 8%)}
.circle:active{transform:scale(.94)}
.dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel);animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(0)}}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--hover);display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer;font-weight:800;font-size:.95rem;flex:none;transition:transform .15s var(--ease)}
.avatar:active{transform:scale(.94)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:64px;height:64px;font-size:1.4rem}
.search{position:relative;display:flex;align-items:center;justify-content:flex-end;height:38px;width:38px;border-radius:19px;border:1px solid var(--line);background:var(--hover);transition:width .4s var(--ease),background-color .3s}
.search:hover,.search:focus-within,.search.keep{width:min(260px,calc(100vw - 250px));background:color-mix(in srgb,var(--hover),var(--text) 6%)}
.search input{flex:1;min-width:0;width:auto;margin:0;padding:0 4px;padding-inline-start:16px;height:36px;background:transparent;border:0;border-radius:0;font-size:.93rem;opacity:0;pointer-events:none;transition:opacity .25s}
.search:hover input,.search:focus-within input,.search.keep input{opacity:1;pointer-events:auto}
.search input:focus-visible{outline:none}
.search .icon-btn{margin:-1px}

.pop{position:absolute;top:46px;inset-inline-end:0;min-width:220px;padding:6px;background:var(--pop);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity .18s,transform .24s var(--ease),visibility .18s}
[dir=rtl] .pop{transform-origin:top left}
.pop.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.search .pop{width:100%;min-width:0}
.pop .row{display:block;width:100%;padding:9px 11px;border:0;border-radius:11px;background:none;text-align:start;cursor:pointer;font-size:.93rem;transition:background-color .15s}
.pop .row:hover{background:var(--hover)}
.pop .row.danger{color:var(--err)}
.pop .empty,.pop .who{padding:9px 11px;color:var(--muted);font-size:.88rem}
.pop .who b{display:block;color:var(--text);font-size:.98rem}
.pop .sep{height:1px;background:var(--line);margin:5px 4px}
.wrap{position:relative}

/* ---------- settings ---------- */
#view-settings{max-width:680px;margin-inline:auto}
.cards{display:grid;gap:14px;margin-top:22px}
.card{position:relative;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;transition:background-color .35s,border-color .35s}
.card:has(.dd.open){z-index:5}
.card h3{margin:0 0 14px;font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.hint{margin:-8px 0 14px;color:var(--muted);font-size:.88rem;line-height:1.45}
.field{display:grid;gap:6px;margin-top:14px}
.field:first-of-type{margin-top:0}
.profile-row{display:flex;align-items:center;gap:14px}
.inp,.secret{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 6px 0 14px;padding-inline:14px 6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:.95rem;transition:border-color .2s}
input.inp{padding-inline:14px}
.inp:focus,.secret:focus-within{border-color:var(--accent);outline:none}
.secret input{flex:1;min-width:0;height:40px;margin:0;padding:0;border:0;background:transparent;font-size:.95rem}
.secret input:focus-visible{outline:none}
.secret .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.reveal{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;flex:none;transition:color .2s,background-color .2s}
.reveal:hover{color:var(--text);background:var(--hover)}
.reveal .slash{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .3s var(--ease)}
.reveal[aria-pressed=true]{color:var(--accent-text)}
.reveal[aria-pressed=true] .slash{stroke-dashoffset:1}

.secret.bad{border-color:var(--err)}
.sub-hint{margin:0;color:var(--muted);font-size:.82rem;line-height:1.4}
.secret .val.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.06em;direction:ltr;text-align:start}

/* Kopieren-Button: Icon wird zum Haken */
.copy{position:relative;width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;flex:none;transition:color .25s,background-color .25s,transform .15s var(--ease)}
.copy:hover{color:var(--text);background:var(--hover)}
.copy:active{transform:scale(.88)}
.copy:disabled{opacity:.4;pointer-events:none}
.copy>*{grid-area:1/1}
.copy-ico{width:16px;height:16px;transition:transform .45s var(--ease) .12s,opacity .25s ease .12s}
.copy-check{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .3s var(--ease),opacity 0s .3s}
.copy::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
.copy.done,.copy.done:hover{color:var(--accent-text);background:color-mix(in srgb,var(--accent),transparent 86%)}
.copy.done .copy-ico{transform:scale(.2) rotate(-120deg);opacity:0;transition-delay:0s}
.copy.done .copy-check{stroke-dashoffset:0;opacity:1;transition:stroke-dashoffset .45s var(--ease) .14s,opacity 0s .14s;animation:checkpop .55s var(--ease) .14s}
.copy.done::after{animation:copyring .7s var(--ease)}
@keyframes copyring{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.55)}}
@keyframes checkpop{0%{transform:scale(.6)}55%{transform:scale(1.18)}100%{transform:scale(1)}}

/* Passwort-Regeln */
.rules{display:flex;flex-wrap:wrap;gap:4px 16px;margin:2px 0 0;padding:0;list-style:none;font-size:.82rem;color:var(--muted)}
.rules li{display:flex;align-items:center;gap:6px;transition:color .25s}
.rules li::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;transition:background-color .25s,border-color .25s}
.rules li.ok{color:var(--accent-text)}
.rules li.ok::before{background:var(--accent);border-color:var(--accent)}

button.ghost,button.danger-ghost{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:.93rem;cursor:pointer;transition:background-color .2s,border-color .2s,transform .15s var(--ease)}
button.ghost:hover{background:var(--hover)}
button.ghost:active,button.danger-ghost:active{transform:scale(.97)}
button.danger-ghost{color:var(--err);border-color:color-mix(in srgb,var(--err),transparent 60%)}
button.danger-ghost:hover{background:color-mix(in srgb,var(--err),transparent 90%)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

.lock{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.9rem}
.lock .l{display:flex;align-items:center;gap:8px}
.lock b{color:var(--text);font-weight:600}

.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;transition:opacity .3s}
.seg.off{opacity:.4;pointer-events:none}
.seg-thumb{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--accent);transform:translateX(calc(var(--i,0)*100%));transition:transform .4s var(--ease),background-color .35s}
[dir=rtl] .seg-thumb{transform:translateX(calc(var(--i,0)*-100%))}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;transition:color .3s}
.seg button.on{color:var(--accent-ink)}
.seg .ico{width:18px;height:18px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.between .tt{display:grid;gap:2px}
.between .tt small{color:var(--muted);font-size:.85rem}
.switch{width:44px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer;flex:none;padding:0;transition:background-color .25s,border-color .25s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .3s var(--ease),background-color .25s}
.switch[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(18px);background:var(--accent-ink)}
[dir=rtl] .switch[aria-checked=true]::after{transform:translateX(-18px)}
.collapse{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s var(--ease),opacity .3s}
.collapse.open{grid-template-rows:1fr;opacity:1}
.collapse>div{overflow:hidden}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px}
.color{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.color span{display:grid;gap:1px;font-size:.88rem;color:var(--muted)}
.color small{color:var(--text);font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:start}
.color input{width:30px;height:30px;padding:0;margin:0;border:0;background:none;border-radius:50%;cursor:pointer;flex:none}
.color input::-webkit-color-swatch-wrapper{padding:0}
.color input::-webkit-color-swatch{border:1px solid var(--line);border-radius:50%}
.color input::-moz-color-swatch{border:1px solid var(--line);border-radius:50%}

.savebar{position:absolute;inset-inline:var(--cs) 0;padding-inline:8px 26px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:8;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(26px) scale(.92);transition:opacity .3s,transform .45s var(--ease),visibility .3s,inset-inline-start .42s var(--ease)}
.savebar.show{opacity:1;visibility:visible;transform:none}
.savebar .primary{pointer-events:auto;padding:13px 32px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.32)}

/* ---------- Custom Dropdown (wiederverwendbar) ---------- */
.dd{position:relative}
.dd.open{z-index:30}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;height:42px;padding:0 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:.95rem;text-align:start;transition:border-color .2s}
.dd-btn:hover,.dd.open .dd-btn{border-color:color-mix(in srgb,var(--line),var(--text) 30%)}
.dd-btn svg{flex:none;color:var(--muted);transition:transform .3s var(--ease)}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-list{position:absolute;inset-inline:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--pop);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top;transition:opacity .18s,transform .25s var(--ease),visibility .18s}
.dd.open .dd-list{opacity:1;visibility:visible;transform:none}
.dd-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:.93rem;transition:background-color .15s}
.dd-list li:hover,.dd-list li.hl{background:var(--hover)}
.dd-list li[aria-selected=true]{color:var(--accent-text);font-weight:600}
.dd-list li[aria-selected=true]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- Dialog + Toast ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.overlay.open{opacity:1;visibility:visible}
.dialog{width:100%;max-width:380px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transform:translateY(14px) scale(.96);transition:transform .32s var(--ease)}
.overlay.open .dialog{transform:none}
.dialog h3{margin:0 0 8px;font-size:1.15rem}
.dialog p{margin:0 0 16px;color:var(--muted);line-height:1.5;font-size:.93rem}
.dialog .inp{padding-inline:14px}
.dlg-err{min-height:1.3em;margin:8px 0 0!important;color:var(--err)!important;font-size:.88rem!important}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.toast{position:fixed;bottom:30px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;padding:11px 18px;background:var(--text);color:var(--bg);border-radius:14px;font-weight:600;font-size:.93rem;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .25s,transform .35s var(--ease),visibility .25s;z-index:60}
.toast.show{opacity:1;visibility:visible;transform:none}
.toast.bad{background:var(--err);color:#1a0606}

/* Mobile Suche als Fenster */
.overlay.sheet{align-items:start;padding-top:calc(env(safe-area-inset-top,0px) + 56px);transition:opacity .22s,visibility 0s linear .22s}
.overlay.sheet.open{transition:opacity .22s,visibility 0s}
.sdlg{padding:10px;max-width:420px}
.sbox{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--muted);transition:border-color .2s}
.sbox:focus-within{border-color:var(--accent)}
.sbox .ico{width:18px;height:18px}
.sbox input{flex:1;min-width:0;height:44px;margin:0;padding:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--text)}
.slist{display:grid;gap:2px;max-height:min(50vh,320px);overflow:auto;margin-top:8px}
.slist .row{display:block;width:100%;padding:12px;border:0;border-radius:11px;background:none;text-align:start;cursor:pointer;font-size:.95rem;transition:background-color .15s}
.slist .row:hover,.slist .row:active{background:var(--hover)}
.slist .empty{padding:12px;color:var(--muted);font-size:.9rem}

/* ---------- Kalender ---------- */
#view-cal{max-width:1060px;margin-inline:auto;--cp:350px}
.cal-top{margin-bottom:18px}
.cal-top .big{font-size:3.6rem;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--accent-text)}
.cal-top .wd{margin-top:6px;color:var(--muted);font-size:1.05rem}
.cal-grid{display:grid;grid-template-columns:minmax(0,1fr) 0px;transition:grid-template-columns .5s var(--ease)}
.cal-grid.sel{grid-template-columns:minmax(0,1fr) calc(var(--cp) + 16px)}
.cal-main{min-width:0}
.cal-card{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:22px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cal-title{position:relative;display:flex;align-items:baseline;gap:6px;min-width:0}
.cal-title b{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.cal-year{border:0;background:none;cursor:pointer;font-size:1.1rem;font-weight:400;color:var(--muted);padding:2px 8px;border-radius:10px;transition:background-color .2s,color .2s}
.cal-year:hover,.open .cal-year{background:var(--hover);color:var(--text)}
.yr-list{position:absolute;top:calc(100% + 8px);inset-inline-start:0;z-index:20;width:120px;max-height:240px;overflow:auto;margin:0;padding:6px;list-style:none;background:var(--pop);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .25s var(--ease),visibility .2s;scrollbar-width:thin}
.open>.yr-list{opacity:1;visibility:visible;transform:none}
.yr-list li{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:.93rem}
.yr-list li:hover{background:var(--hover)}
.yr-list li[aria-selected=true]{color:var(--accent-text);font-weight:700}
.cal-nav{display:flex;gap:8px}
.cal-nav .icon-btn{width:36px;height:36px}
[dir=rtl] .cal-nav svg{transform:scaleX(-1)}
.cal-wds,.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wds{margin-bottom:8px}
.cal-wds span{height:30px;border-radius:999px;background:var(--hover);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--muted);transition:height .4s var(--ease),font-size .4s}
.cal-day{position:relative;height:64px;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:18px;background:color-mix(in srgb,var(--bg),var(--text) 5%);cursor:pointer;font-weight:600;transition:height .45s var(--ease),background-color .2s,transform .15s}
.cal-day:hover{background:var(--hover)}
.cal-day:active{transform:scale(.95)}
.cal-day .n{margin-bottom:8px}
.cal-day.past{background:color-mix(in srgb,var(--panel),#000 16%);color:var(--muted)}
.cal-day.today{background:var(--accent);color:var(--accent-ink)}
.cal-day.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent),transparent 55%)}
.cal-day.today.sel{border-color:var(--text)}
.cal-dots{position:absolute;bottom:9px;inset-inline:0;display:flex;justify-content:center;gap:3px}
.cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cal-dots i:nth-child(2){filter:hue-rotate(60deg)}
.cal-dots i:nth-child(3){filter:hue-rotate(125deg)}
.today .cal-dots i{background:var(--accent-ink);filter:none;opacity:.85}
.cal-dots.alldone{opacity:.4}
.cal-grid.sel .cal-day{height:46px;border-radius:14px}
.cal-grid.sel .cal-day .n{margin-bottom:6px;font-size:.92rem}
.cal-grid.sel .cal-dots{bottom:6px}
.cal-grid.sel .cal-wds span{height:24px;font-size:.72rem}
.cal-list{margin-top:22px}
.cal-list h3{margin:0 0 10px;font-size:1rem;font-weight:700}
.cal-list h3 b{color:var(--accent-text)}
.cal-li{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;cursor:pointer;text-align:start;transition:background-color .2s}
.cal-li:hover{background:var(--hover)}
.cal-li .dt{min-width:52px;font-weight:700;color:var(--accent-text);font-size:.9rem}
.cal-li .cal-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-li.done .cal-tt{text-decoration:line-through;color:var(--muted)}
.cal-more{padding:6px 4px;color:var(--muted);font-size:.9rem}
.cal-side{min-width:0;overflow:hidden;align-self:start;position:sticky;top:0}
.cal-sheet{width:var(--cp);margin-inline-start:16px;padding:16px;display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;opacity:0;visibility:hidden;transform:translateX(26px);transition:opacity .3s,transform .45s var(--ease),visibility 0s .45s}
[dir=rtl] .cal-sheet{transform:translateX(-26px)}
.cal-grid.sel .cal-sheet{opacity:1;visibility:visible;transform:none;transition:opacity .3s .1s,transform .45s var(--ease),visibility 0s}
.cal-ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-ph b{font-size:1.08rem;letter-spacing:-.01em}
.cal-x{width:32px;height:32px}
.cal-create{padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.cal-create h4{margin:0 0 10px;font-size:.95rem}
.cal-rows{display:grid;gap:8px;margin-bottom:10px}
.cal-r{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:center}
.cal-rows.multi .cal-r{grid-template-columns:minmax(0,1fr) 112px 32px}
.cal-rows:not(.multi) .reveal{display:none}
.cal-r input.inp{padding-inline:12px;min-width:0;background:var(--panel)}
.cal-create .link{display:block;margin-bottom:12px;font-size:.9rem}
.cal-create .primary{width:100%}
.act{position:relative;height:38px;border-radius:14px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.act-fill{position:absolute;inset-block:0;inset-inline-start:0;width:0;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent),var(--bg) 35%),var(--accent) 60%,color-mix(in srgb,var(--accent),#fff 38%));opacity:.8;transition:width .7s var(--ease)}
.act-t{position:relative;display:flex;align-items:center;gap:8px;height:100%;padding-inline:14px;font-size:.9rem;font-weight:700}
.act-t small{font-size:.82rem;font-weight:600;opacity:.8}
.cal-its{display:grid;gap:8px}
.cal-it{background:var(--bg);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.cal-it-b{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;background:none;cursor:pointer;text-align:start}
.cal-chk{display:grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);color:var(--accent-ink)}
.cal-it.done .cal-chk{background:var(--accent);border-color:var(--accent)}
.cal-it.done .cal-tt{text-decoration:line-through;color:var(--muted)}
.cal-tm{font-variant-numeric:tabular-nums;color:var(--accent-text);font-weight:700;font-size:.88rem}
.cal-it .cal-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 12px}
.cal-acts .ghost,.cal-acts .danger-ghost,.cal-acts .primary{padding:7px 12px;font-size:.88rem;border-radius:10px}
.cal-acts input.inp{flex:1 1 120px;min-width:0;padding-inline:10px;height:38px}
@media (max-width:1000px){#view-cal{--cp:310px}}
@media (max-width:760px){
  .cal-top{margin-bottom:14px}
  .cal-top .big{font-size:2.8rem}
  .cal-grid,.cal-grid.sel{grid-template-columns:minmax(0,1fr)}
  .cal-card{padding:12px;border-radius:20px}
  .cal-title b{font-size:1.3rem}
  .cal-wds,.cal-days{gap:4px}
  .cal-wds span,.cal-grid.sel .cal-wds span{height:28px;font-size:.74rem}
  .cal-day,.cal-grid.sel .cal-day{height:48px;border-radius:14px}
  .cal-day .n,.cal-grid.sel .cal-day .n{font-size:.95rem;margin-bottom:7px}
  .cal-dots,.cal-grid.sel .cal-dots{bottom:6px}
}
/* Tagesfenster (Handy): liegt direkt am body, ueber allem */
.cal-side.phone{position:fixed;inset:0;height:100dvh;align-self:stretch;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .3s;position:fixed;top:0}
.cal-side.phone.show{opacity:1;visibility:visible;transition:opacity .25s,visibility 0s}
.cal-side.phone .cal-sheet{width:100%;max-width:520px;margin:0;max-height:84dvh;overflow:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;border-bottom:0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));opacity:1;visibility:visible;transform:translateY(60px);transition:transform .4s var(--ease)}
.cal-side.phone.show .cal-sheet{transform:none}
.cal-side.phone .cal-sheet::before{content:"";justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--line);margin-bottom:2px}
.cal-r{grid-template-columns:minmax(0,1fr) 104px}
.cal-rows.multi .cal-r{grid-template-columns:minmax(0,1fr) 104px 32px}

/* ---------- Tasks & Goals ---------- */
#view-tasks{max-width:920px;margin-inline:auto}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (min-width:761px){.t-head{padding-inline-end:150px}}
.t-new{display:flex;align-items:center;gap:8px;height:40px;padding:0 18px!important;border-radius:999px!important;white-space:nowrap}
.t-new svg{width:14px;height:14px}
.t-today{display:flex;flex-direction:column;justify-content:space-between;width:min(190px,100%);aspect-ratio:1;margin-top:22px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:28px}
.t-today-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.t-today-l{font-weight:700;font-size:1rem;line-height:1.25;max-width:90px}
.t-today-top b{font-size:3rem;line-height:.9;font-weight:800;letter-spacing:-.04em;color:var(--accent-text);font-variant-numeric:tabular-nums}
.t-today-sub{color:var(--muted);font-size:.88rem}
.t-sec{margin-top:28px}
.t-sec>h3{margin:0 0 12px;font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.t-card{position:relative;display:flex;flex-direction:column;gap:10px;min-height:200px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;transition:border-color .3s,background-color .3s}
.t-card:has(.t-menu.open){z-index:5}
.t-card.done{border-color:color-mix(in srgb,var(--accent),transparent 55%)}
.t-top{position:relative;display:flex;align-items:center;justify-content:space-between;height:32px}
.t-badge{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);transform:scale(0);opacity:0;transition:transform .45s var(--ease),opacity .2s}
.t-badge svg{width:14px;height:14px;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s var(--ease) 0s}
.t-card.done .t-badge{transform:scale(1);opacity:1}
.t-card.done .t-badge svg{stroke-dashoffset:0;transition-delay:.2s}
.t-dots{width:32px;height:32px;margin-inline-start:auto}
.t-dots:hover{background:var(--hover)}
.t-menu{top:36px!important;min-width:160px}
.t-title{flex:1;font-weight:700;font-size:1.05rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;word-break:break-word;transition:color .3s}
.t-card.done .t-title{color:var(--muted)}
.t-date{color:var(--muted);font-size:.85rem}
.t-date.late{color:var(--err)}
.t-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;padding:0 10px;border:1.5px solid var(--accent);border-radius:13px;background:transparent;color:var(--accent-text);font-weight:700;font-size:.9rem;cursor:pointer;transition:background-color .3s,color .3s,border-color .3s,transform .15s var(--ease)}
.t-btn:hover{background:color-mix(in srgb,var(--accent),transparent 86%)}
.t-btn:active{transform:scale(.96)}
.t-btn.on{background:var(--accent);color:var(--accent-ink)}
.t-btn.on:hover{background:color-mix(in srgb,var(--accent),#fff 14%)}
.t-btn.pulse{animation:tpulse .5s var(--ease)}
.t-bi{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.t-bi path{stroke-dasharray:1;stroke-dashoffset:.0}
.t-btn.pulse .t-bi path{animation:tdraw .5s var(--ease)}
.t-btn .burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--accent);animation:tburst .65s var(--ease) forwards}
.burst i:nth-child(2n){background:#ffb454;width:5px;height:5px}
.burst i:nth-child(3n){background:#6aa8ff}
@keyframes tburst{from{transform:rotate(calc(var(--a)*1deg)) translateX(8px) scale(1);opacity:1}to{transform:rotate(calc(var(--a)*1deg)) translateX(52px) scale(.2);opacity:0}}
@keyframes tpulse{0%{transform:scale(.94)}55%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes tdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.two .seg-thumb{width:calc((100% - 8px)/2)}
.t-sum{padding:16px}
.t-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.t-stat{padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:16px}
.t-stat span{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.82rem}
.t-stat span i{width:8px;height:8px;border-radius:50%;flex:none}
.t-stat b{display:block;margin-top:4px;font-size:1.9rem;line-height:1.1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.k-done{background:var(--accent)}.k-open{background:#ffb454}.k-up{background:#6aa8ff}
.t-chart{position:relative;margin-top:16px;padding:12px 8px 6px;background:var(--bg);border:1px solid var(--line);border-radius:18px}
.t-chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.t-chart .gl{stroke:var(--line);stroke-width:1}
.t-chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.t-chart .ln{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:tline 1.3s var(--ease) forwards}
.t-chart .c-done{stroke:var(--accent)}
.t-chart .c-open{stroke:#ffb454;animation-delay:.18s}
.t-chart .c-up{stroke:#6aa8ff;animation-delay:.36s}
.t-chart .area{opacity:0;animation:tfade .9s ease .5s forwards}
.t-chart .endp{opacity:0;animation:tfade .3s ease 1.2s forwards}
.t-chart .nowl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.t-chart .hl{stroke:var(--text);stroke-width:1;opacity:.35}
.t-chart .hv{opacity:0;transition:opacity .15s}
.t-chart.hov .hv{opacity:1}
.t-chart .hv circle{stroke:var(--bg);stroke-width:2.5}
.dc-done{fill:var(--accent)}.dc-open{fill:#ffb454}.dc-up{fill:#6aa8ff}
@keyframes tline{to{stroke-dashoffset:0}}
@keyframes tfade{to{opacity:1}}
.t-tip{position:absolute;top:6px;z-index:3;padding:9px 11px;border-radius:13px;background:var(--pop);border:1px solid var(--line);box-shadow:var(--shadow);font-size:.82rem;white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-50%);transition:opacity .15s}
.t-chart.hov .t-tip{opacity:1}
.t-tip b{display:block;margin-bottom:4px}
.t-tip div{display:flex;align-items:center;gap:7px;color:var(--muted)}
.t-tip div i{width:8px;height:8px;border-radius:50%}
.t-tip div em{margin-inline-start:auto;padding-inline-start:12px;font-style:normal;font-weight:700;color:var(--text)}
.t-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;color:var(--muted);font-size:.85rem}
.t-legend span{display:flex;align-items:center;gap:7px}
.t-legend i{width:18px;height:4px;border-radius:2px}

.gl-period{margin:16px 0 8px;font-weight:700;color:var(--accent-text)}
.gl-list{display:grid;gap:8px}
.g-it{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.g-chk{position:relative;flex:none;width:26px;height:26px;display:grid;place-items:center;padding:0;border:2px solid var(--line);border-radius:50%;background:transparent;color:var(--accent-ink);cursor:pointer;transition:border-color .3s}
.g-chk::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .5s var(--ease)}
.g-chk svg{position:relative;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .25s ease}
.g-it.done .g-chk{border-color:var(--accent)}
.g-it.done .g-chk::before{transform:scale(1)}
.g-it.done .g-chk svg{stroke-dashoffset:0;transition:stroke-dashoffset .4s var(--ease) .22s}
.g-it.fx.done .g-chk{animation:gpop .55s var(--ease)}
.g-it.fx.done .g-chk::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);animation:copyring .7s var(--ease) forwards;pointer-events:none}
@keyframes gpop{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.g-tt{flex:1;min-width:0;cursor:pointer;word-break:break-word;transition:color .3s}
.g-it.done .g-tt{color:var(--muted);text-decoration:line-through}
.gl-add{display:flex;gap:8px;margin-top:12px}
.gl-add .primary{flex:none;padding:0 18px;height:42px}
.gl-lab{display:block;margin:18px 0 6px}
.gl-ta{display:block;width:100%;min-height:120px;padding:12px 14px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:14px;font-size:.95rem;line-height:1.5;transition:border-color .2s}
.gl-ta:focus{border-color:var(--accent);outline:none}
@media (max-width:560px){.t-stats{gap:8px}.t-stat{padding:10px}.t-stat b{font-size:1.5rem}.t-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:380px){.t-grid{grid-template-columns:1fr}}

/* ---------- Handy: Dock unten ---------- */
.dock{display:none}
html{touch-action:manipulation}
html,body{overflow-x:hidden;overscroll-behavior-x:none}
.scroll{overflow-x:hidden}
@media (max-width:760px){
  aside,.scrim{display:none!important}
  .frame{--cs:0px}
  .scroll{inset-inline-start:0;padding-block:68px 120px;padding-inline:14px}
  .savebar{bottom:96px;padding-inline:14px}
  .toast{bottom:100px}
  .dock{display:flex;align-items:center;position:absolute;z-index:12;bottom:14px;left:50%;transform:translateX(-50%);padding:8px;border-radius:999px;background:color-mix(in srgb,var(--bg),var(--text) 10%);border:1px solid var(--line);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background-color .35s,border-color .35s}
  .dock-logo,.dock-btn{width:48px;height:48px;flex:none;display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--muted);transition:background-color .25s,color .25s,transform .2s var(--ease)}
  .dock-logo{color:var(--accent)}
  .dock-logo .ico{width:22px;height:26px}
  .dock-logo:active,.dock-btn:active{transform:scale(.9)}
  .dock-clip{overflow:hidden;max-width:220px;opacity:1;transition:max-width .5s var(--ease),opacity .3s}
  .dock-in{display:flex;gap:4px;width:max-content;padding-inline-start:6px}
  .dock-btn .ico{width:22px;height:22px}
  .dock-btn.active{background:var(--accent);color:var(--accent-ink)}
  .dock.min .dock-clip{max-width:0;opacity:0}
  .dock.min .dock-logo{background:transparent}
}

@media (max-width:900px){
  .frame{--cs:calc(var(--sc) + 24px)}
  .scrim{display:block}
  body:not(.collapsed) .scrim{opacity:1;visibility:visible}
  body:not(.collapsed) aside{box-shadow:var(--shadow)}
}
@media (max-width:760px){
  .frame{inset:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));border-radius:24px;--cs:calc(var(--sc) + 20px)}
  aside{inset-inline-start:8px;top:8px;bottom:8px;border-radius:19px}
  .scroll{padding-block:20px 110px;padding-inline:6px 14px}
  .tools{inset-inline-end:12px;top:18px;gap:7px}
  .search:hover,.search:focus-within,.search.keep{width:min(220px,calc(100vw - 230px))}
  .colors{grid-template-columns:1fr}
}
@media (max-width:560px){
  :root{--sc:56px}
  .scroll{padding-block-start:68px}
  .search:hover,.search:focus-within,.search.keep{width:min(240px,calc(100vw - 150px))}
  .cards{gap:12px}
  .card{padding:15px;border-radius:18px}
  .dialog{padding:18px}
  .lock{flex-direction:column;align-items:flex-start;gap:4px}
}
@media (max-width:760px),(hover:none) and (pointer:coarse){
  .search,.search:hover,.search:focus-within,.search.keep{width:38px;background:var(--hover)}
  .search input,.search .pop{display:none}
}
@media (pointer:coarse){
  input,textarea,.inp,.secret input,.search input{font-size:16px}
  .nav,.side-toggle{min-height:46px}
  .reveal{width:38px;height:38px}
  .dd-btn,.inp,.secret{height:46px}
  .dd-list li{padding:12px 10px}
  .seg button{height:42px}
}
@media (prefers-reduced-motion:no-preference){main>section:not([hidden]){animation:rise .35s var(--ease)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <span class="ico logo" style="--m:var(--i-logo)" role="img" aria-label="next logo"></span>

  <section id="login">
    <h1 data-i18n="log_in"></h1>
    <p class="sub" data-i18n="welcome"></p>
    <form data-form="login">
      <label><span data-i18n="email"></span><input type="email" name="email" autocomplete="email" required></label>
      <label><span data-i18n="password"></span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit" data-i18n="log_in"></button>
    </form>
    <div class="divider" data-i18n="or"></div>
    <button class="oauth" type="button" data-oauth="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span data-i18n="google"></span></button>
    <p class="alt"><span data-i18n="no_account"></span> <button class="link" data-go="register" data-i18n="sign_up"></button></p>
  </section>

  <section id="register" hidden>
    <h1 data-i18n="create_account"></h1>
    <p class="sub" data-i18n="reg_sub"></p>
    <form data-form="register">
      <label><span data-i18n="email"></span><input type="email" name="email" autocomplete="email" required></label>
      <label><span data-i18n="pw8"></span><input type="password" name="password" autocomplete="new-password" required></label>
      <ul class="rules" id="reg-rules"><li data-r="len" data-i18n="rule_len"></li><li data-r="num" data-i18n="rule_num"></li></ul>
      <button class="primary" type="submit" data-i18n="sign_up"></button>
    </form>
    <div class="divider" data-i18n="or"></div>
    <button class="oauth" type="button" data-oauth="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg><span data-i18n="google"></span></button>
    <p class="alt"><span data-i18n="have_account"></span> <button class="link" data-go="login" data-i18n="log_in"></button></p>
  </section>

  <section id="verify" hidden>
    <h1 data-i18n="check_mail"></h1>
    <p class="sub" id="verify-sub"></p>
    <form data-form="verify">
      <input class="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" data-i18n-aria="code_label" required>
      <button class="primary" type="submit" data-i18n="verify"></button>
    </form>
    <p class="alt"><span data-i18n="no_mail"></span> <button class="link" id="resend" data-i18n="resend"></button></p>
  </section>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<div id="app">
  <div class="frame">
    <aside id="aside">
      <button class="brand" id="brand" type="button" aria-label="Dashboard"><span class="ico brand-ico" style="--m:var(--i-logo)"></span><span class="lbl">next</span></button>
      <nav class="navs" id="navs">
        <span class="pill" id="pill"></span>
        <button class="nav active" data-view="dash" type="button"><span class="ico" style="--m:var(--i-dash)"></span><span class="lbl" data-i18n="nav_dash"></span></button>
        <button class="nav" data-view="cal" type="button"><span class="ico" style="--m:var(--i-cal)"></span><span class="lbl" data-i18n="nav_cal"></span></button>
        <button class="nav" data-view="tasks" type="button"><span class="ico" style="--m:var(--i-tasks)"></span><span class="lbl" data-i18n="nav_tasks"></span></button>
        <button class="nav" data-view="settings" type="button"><span class="ico" style="--m:var(--i-settings)"></span><span class="lbl" data-i18n="nav_settings"></span></button>

/* ---------- Login ---------- */
function show(id){
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
  setMsg('');
  const first = $('#'+id+' input'); if(first) first.focus();
}
function setMsg(text, ok){ msg.textContent = text; msg.className = 'msg' + (ok ? ' ok' : ''); }
function showVerify(email){
  pendingEmail = email;
  $('#verify-sub').textContent = t('code_sent', { email });
  show('verify');
}
async function busy(form, fn){
  const b = form.querySelector('button[type=submit]'); b.disabled = true;
  try { await fn(); } catch(e){ setMsg(e.message || t('generic_err')); }
  b.disabled = false;
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));

const pwOk = p => p.length >= 8 && /\d/.test(p);
function updateRules(list, p){
  list.querySelectorAll('li').forEach(li => li.classList.toggle('ok', li.dataset.r === 'len' ? p.length >= 8 : /\d/.test(p)));
}
function authMsg(err){
  const m = (err && err.message) || '';
  if (/already (been )?registered|already exists/i.test(m)) return t('already_reg');
  if (/invalid login credentials/i.test(m)) return t('bad_login');
  if (/password/i.test(m) && /(short|weak|least|characters|contain)/i.test(m)) return t('pw_short');
  return m || t('generic_err');
}
document.querySelector('[data-form=register] [name=password]').addEventListener('input', e => updateRules($('#reg-rules'), e.target.value));

document.querySelector('[data-form=register]').onsubmit = e => {
  e.preventDefault(); const f = e.target;
  busy(f, async () => {
    const email = f.email.value.trim().toLowerCase();
    const password = f.password.value;
    if (!pwOk(password)) return setMsg(t('pw_short'));
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) return setMsg(authMsg(error));
    // Supabase meldet eine bereits vergebene E-Mail als User ohne Identitäten zurück
    if (data.user && data.user.identities && data.user.identities.length === 0)
      return setMsg(t('already_reg'));
    showVerify(email);
  });
};
document.querySelector('[data-form=login]').onsubmit = e => {
  e.preventDefault(); const f = e.target;
  busy(f, async () => {
    const email = f.email.value.trim().toLowerCase();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: f.password.value });
    if (error) {
      if (/not confirmed/i.test(error.message)) {
        await sb.auth.resend({ type: 'signup', email });
        showVerify(email); return setMsg(t('verify_first'), true);
      }
      return setMsg(authMsg(error));
    }
    showApp(data.user);
  });
};
document.querySelector('[data-form=verify]').onsubmit = e => {
  e.preventDefault(); const f = e.target;
  busy(f, async () => {
    const { data, error } = await sb.auth.verifyOtp({ email: pendingEmail, token: f.code.value.trim(), type: 'signup' });
    if (error) return setMsg(t('bad_code'));
    showApp(data.user);
  });
};
$('#resend').onclick = async () => {
  const { error } = await sb.auth.resend({ type: 'signup', email: pendingEmail });
  setMsg(error ? error.message : t('new_code'), !error);
};
document.querySelectorAll('[data-oauth]').forEach(b => b.onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: b.dataset.oauth, options: { redirectTo: location.origin + location.pathname } });
  if (error) setMsg(error.message);
});

const prefsOnly = p => ({ theme:p.theme, custom:p.custom, main:p.main, second:p.second, lang:p.lang, emailVisible:p.emailVisible });

let draft = { ...saved };
let pendingAvatar = null, pendingUrl = null;

function fullName(u){
  const m = u.user_metadata || {};
  const n = (m.full_name || m.name || (u.email || '').split('@')[0] || '').trim();
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
}
let profile = null; // { username, user_code } aus der Tabelle "profiles" (null, falls setup.sql noch fehlt)
function displayName(){ return ((saved.name || (currentUser ? fullName(currentUser) : '')).split(/\s+/)[0]) || 'du'; }
function buildSaved(u){
  const s = (u.user_metadata || {}).settings || {};
  const p = Prefs.clean({ ...Prefs.load(), ...s });
  return { ...p, name: (profile && profile.username) || fullName(u) };
}
function loadFromUser(u){
  saved = buildSaved(u);
  draft = { ...saved };
  Prefs.store(prefsOnly(saved));
  Prefs.apply(saved);
  if (lang !== saved.lang) lang = saved.lang;
  applyI18n();
}

/* ---------- Begrüßung ---------- */
function renderGreeting(){
  const h = new Date().getHours(), n = displayName(currentUser);
  let key, post = lang === 'ar' ? '!' : '!';
  if (h >= 5 && h < 11) key = 'g_morning';
  else if (h >= 11 && h < 17) key = 'g_day';
  else if (h >= 17 && h < 23) key = 'g_evening';
  else { key = 'g_night'; post = lang === 'ar' ? '؟' : '?'; }
  const g = $('#greet'); g.textContent = t(key);
  const s = document.createElement('span'); s.className = 'name'; s.textContent = n;
  g.append(s, post);
}

/* ---------- Server-Abgleich (Handy und PC bleiben synchron) ---------- */
let syncing = false, lastSync = 0;
const avatarOf = u => (u.user_metadata || {}).avatar_url || (u.user_metadata || {}).picture || '';
const sigOf = (s, p, u) => JSON.stringify([prefsOnly(s), s.name, p && p.user_code, avatarOf(u)]);
async function syncRemote(force){
  if (!currentUser || syncing) return;
  if (!force && Date.now() - lastSync < 4000) return;
  syncing = true;
  const me = currentUser.id;
  try {
    const [ur, pr] = await Promise.all([
      sb.auth.getUser(),
      sb.from('profiles').select('username,user_code').eq('id', me).maybeSingle()
    ]);
    if (!currentUser || currentUser.id !== me) return;
    if (ur.error) {
      // Konto wurde woanders gelöscht oder die Sitzung ist ungültig -> lokal abmelden
      if ([401, 403, 404].includes(ur.error.status)) { try { await sb.auth.signOut({ scope: 'local' }); } catch(e){} showLogin(); }
      return;
    }
    const u = ur.data && ur.data.user; if (!u) return;
    const oldSig = sigOf(saved, profile, currentUser);
    if (!pr.error) profile = pr.data || null;
    currentUser = u;
    const fresh = buildSaved(u);
    if (sigOf(fresh, profile, u) === oldSig) return;
    const wasDirty = isDirty();
    saved = fresh;
    if (!wasDirty) {
      draft = { ...saved };
      Prefs.store(prefsOnly(saved)); Prefs.apply(saved);
      if (lang !== saved.lang) { lang = saved.lang; applyI18n(); }
      refreshUserUI(); renderGreeting();
      if (view === 'settings') renderSettings(); else renderUid();
    } else { refreshUserUI(); renderUid(); }
  } catch(e){ /* offline o. Ä. – beim nächsten Mal nochmal */ }
  finally { syncing = false; lastSync = Date.now(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncRemote(); });
window.addEventListener('focus', () => syncRemote());
window.addEventListener('online', () => syncRemote(true));
setInterval(() => { if (!document.hidden) syncRemote(); }, 60000);

/* ---------- Tab-Wechsel mit Animation ---------- */
let view = 'dash', token = 0;
const pill = $('#pill');
function movePill(first){
  const a = document.querySelector('.nav.active'); if (!a || !a.offsetHeight) return;
  pill.style.height = a.offsetHeight + 'px';
  pill.style.transform = 'translateY(' + a.offsetTop + 'px)';
  if (first) { pill.classList.remove('ready'); void pill.offsetWidth; }
  requestAnimationFrame(() => pill.classList.add('ready'));
}
window.addEventListener('resize', () => movePill());
function stagger(v){
  [...v.children].forEach((c, i) => c.style.setProperty('--i', i));
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
}
function go(name, anchor){
  closePops();
  const scroll = $('#scroll');
  if (name === view) {
    const target = anchor && $('#' + anchor);
    if (target) scroll.scrollTo({ top: target.offsetTop - 12, behavior: 'smooth' });
    else scroll.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (view === 'settings') revertDraft();
  const from = document.querySelector('.view:not([hidden])');
  const to = $('#view-' + name);
  view = name; const my = ++token; updateDirty();
  document.querySelectorAll('.nav,.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  movePill();
  if (from) from.classList.add('leave');
  setTimeout(() => {
    if (my !== token) return;
    document.querySelectorAll('.view').forEach(v => { v.hidden = v !== to; v.classList.remove('leave'); });
    scroll.scrollTop = 0;
    if (name === 'settings') renderSettings();
    if (name === 'cal') renderCal();
    if (name === 'tasks') renderTasks();
    stagger(to);
    const target = anchor && $('#' + anchor);
    if (target) setTimeout(() => scroll.scrollTo({ top: target.offsetTop - 12, behavior: 'smooth' }), 120);
  }, from ? 170 : 0);
}
document.querySelectorAll('.nav').forEach(b => b.onclick = () => { go(b.dataset.view); if (narrowMQ.matches && !collapsed) setCollapsed(true); });
$('#brand').onclick = () => { go('dash'); if (narrowMQ.matches && !collapsed) setCollapsed(true); };

function score(it, term){
  const tt = it.t.toLowerCase();
  if (tt.startsWith(term)) return 3;
  if (tt.includes(term)) return 2;
  return it.k.split(' ').some(w => w.startsWith(term)) ? 1 : (it.k.includes(term) ? .5 : 0);

/* ---------- Custom Dropdown (wiederverwendbar) ---------- */
function closeAllDd(){ document.querySelectorAll('.dd.open').forEach(d => d._dd && d._dd.close()); }
function createDropdown(root, options, value, onChange){
  root.innerHTML = '<button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"><span class="dd-val"></span>' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>' +
    '<ul class="dd-list" role="listbox" tabindex="-1"></ul>';
  const btn = root.querySelector('.dd-btn'), val = root.querySelector('.dd-val'), list = root.querySelector('.dd-list');
  let cur = value, hl = -1;
  const label = o => o.key ? t(o.key) : o.label;
  function render(){
    list.textContent = '';
    options.forEach((o, i) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', String(o.value === cur));
      li.dataset.i = i; li.textContent = label(o);
      list.append(li);
    });
    val.textContent = label(options.find(o => o.value === cur) || options[0]);
  }
  function mark(){ [...list.children].forEach((li, i) => li.classList.toggle('hl', i === hl)); }
  function open(on){
    root.classList.toggle('open', on); btn.setAttribute('aria-expanded', String(on));
    if (on) { hl = Math.max(0, options.findIndex(o => o.value === cur)); mark(); }
  }
  function pick(i){ cur = options[i].value; render(); open(false); btn.focus(); onChange(cur); }
  btn.onclick = () => { const was = root.classList.contains('open'); closeAllDd(); open(!was); };
  list.onclick = e => { const li = e.target.closest('li'); if (li) pick(+li.dataset.i); };
  list.onmousemove = e => { const li = e.target.closest('li'); if (li) { hl = +li.dataset.i; mark(); } };
  btn.onkeydown = e => {
    const isOpen = root.classList.contains('open');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!isOpen) { closeAllDd(); open(true); }
      else { hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length; mark(); }
    } else if (e.key === 'Home' && isOpen) { e.preventDefault(); hl = 0; mark(); }
    else if (e.key === 'End' && isOpen) { e.preventDefault(); hl = options.length - 1; mark(); }
    else if ((e.key === 'Enter' || e.key === ' ') && isOpen) { e.preventDefault(); if (hl >= 0) pick(hl); }
    else if (e.key === 'Escape' && isOpen) { e.preventDefault(); e.stopPropagation(); open(false); }
  };
  render();
  const api = { set(v){ cur = v; render(); }, refresh: render, close: () => open(false) };
  root._dd = api;
  return api;
}
const ddVis = createDropdown($('#dd-vis'), [{ value:'0', key:'vis_no' }, { value:'1', key:'vis_yes' }], '0', v => { draft.emailVisible = v === '1'; updateDirty(); });

/* ---------- Kopieren: Icon wird zum Haken (5 s), dann zurück ---------- */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  try {
    const i = document.createElement('input');
    i.value = text; i.setAttribute('readonly', ''); i.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.append(i); i.select(); i.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); i.remove(); return ok;
  } catch(e){ return false; }
}
const copyTimers = new WeakMap();
function flashCopied(btn){
  btn.classList.add('done'); btn.title = t('copied'); btn.setAttribute('aria-label', t('copied'));
  clearTimeout(copyTimers.get(btn));
  copyTimers.set(btn, setTimeout(() => {
    btn.classList.remove('done'); btn.title = t('copy'); btn.setAttribute('aria-label', t('copy'));
  }, 5000));
}
async function doCopy(btn, text){
  if (!text) return;
  if (await copyText(text)) flashCopied(btn); else toast(t('generic_err'), true);
}

async function resizeImage(file, size = 256){
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', .88));
}
