<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>next</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--panel:#131316;--line:#26262c;--text:#f4f4f5;--muted:#8d8d98;--err:#ff7a7a;--accent:#9b8cff;--glass:rgba(255,255,255,.045);--glass-line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:24px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}

/* ---------- login ---------- */
main{width:100%;max-width:400px;text-align:center}
.logo{width:72px;height:auto;display:block;margin:0 auto 28px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
p.sub{color:var(--muted);margin:0 0 28px;line-height:1.5}
form{display:grid;gap:12px;text-align:left}
label{font-size:.85rem;color:var(--muted)}
input{width:100%;margin-top:6px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:1rem}
input.code{text-align:center;font-size:1.8rem;font-weight:600;letter-spacing:.5em;padding-left:calc(16px + .5em)}
button.primary{margin-top:6px;padding:14px;border:0;border-radius:12px;background:#fff;color:#09090b;font-weight:600;font-size:1rem;cursor:pointer}
button.primary:disabled{opacity:.5;cursor:wait}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
button.oauth{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:1rem;cursor:pointer}
button.oauth:hover{border-color:#44444d}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.alt{margin-top:22px;color:var(--muted);font-size:.95rem}
.msg{min-height:1.4em;margin:14px 0 0;font-size:.9rem;color:var(--err)}
.msg.ok{color:#fff}

/* ---------- app ---------- */
#app{display:none}
body.in{display:block;padding:0;background:radial-gradient(60vw 50vh at 85% -10%,rgba(155,140,255,.22),transparent 70%),radial-gradient(50vw 50vh at 0% 100%,rgba(155,140,255,.12),transparent 70%),var(--bg);background-attachment:fixed}
body.in main{display:none}
body.in #app{display:block}
aside{position:fixed;left:16px;top:16px;bottom:16px;width:232px;padding:22px 14px;background:var(--glass);border:1px solid var(--glass-line);border-radius:24px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:4}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 26px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.brand img{width:26px;height:auto}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:14px;background:rgba(255,255,255,.09);font-size:1rem;font-weight:600;text-align:left;cursor:pointer}
.nav img{width:18px;height:18px;object-fit:contain}
.content{margin-left:264px;padding:120px 48px 80px;min-height:100vh}
.greet{margin:0;font-size:clamp(2rem,4.5vw,3.4rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.greet .name{color:var(--accent)}
.hint{margin:14px 0 0;color:var(--muted)}

.tools{position:fixed;top:20px;right:28px;display:flex;align-items:center;gap:10px;z-index:6}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--glass)}
.icon-btn img{width:20px;height:20px;object-fit:contain}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer;font-weight:800;font-size:1rem;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.search{position:relative;display:flex;align-items:center;justify-content:flex-end;height:40px;width:40px;border-radius:20px;border:1px solid transparent;transition:width .38s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
.search:hover,.search:focus-within,.search.keep{width:min(280px,calc(100vw - 230px));background:var(--glass);border-color:var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.search input{flex:1;min-width:0;width:auto;margin:0;padding:0 4px 0 16px;height:38px;background:transparent;border:0;border-radius:0;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .25s}
.search:hover input,.search:focus-within input,.search.keep input{opacity:1;pointer-events:auto}
.search input:focus-visible{outline:none}
.search .icon-btn:hover{background:transparent}
.pop{position:absolute;top:50px;right:0;min-width:240px;padding:8px;background:rgba(24,24,28,.92);border:1px solid var(--glass-line);border-radius:16px;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.search .pop{width:100%;min-width:0}
.pop .row{display:block;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer;font-size:.95rem}
.pop .row:hover,.pop .row.active{background:rgba(255,255,255,.09)}
.pop .empty,.pop .who{padding:10px 12px;color:var(--muted);font-size:.9rem}
.pop .who b{display:block;color:var(--text);font-size:1rem}
.wrap{position:relative}

@media (max-width:760px){
  aside{width:64px;padding:18px 10px}
  .brand span,.nav span{display:none}
  .brand{padding:2px 8px 22px}
  .nav{justify-content:center;padding:12px 0}
  .content{margin-left:92px;padding:110px 20px 60px}
  .tools{right:14px;gap:4px}
}
@media (prefers-reduced-motion:no-preference){main>section:not([hidden]){animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="next logo">

  <section id="login">
    <h1>Log in</h1>
    <p class="sub">Welcome back to next.</p>
    <form data-form="login">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Log in</button>
    </form>
    <div class="divider">or</div>
    <button class="oauth" type="button" data-oauth="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
    <p class="alt">No account yet? <button class="link" data-go="register">Sign up</button></p>
  </section>

  <section id="register" hidden>
    <h1>Create account</h1>
    <p class="sub">Sign up with your email and a password.</p>
    <form data-form="register">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <label>Password (at least 8 characters)<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <button class="primary" type="submit">Sign up</button>
    </form>
    <div class="divider">or</div>
    <button class="oauth" type="button" data-oauth="google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
    <p class="alt">Already have an account? <button class="link" data-go="login">Log in</button></p>
  </section>

  <section id="verify" hidden>
    <h1>Check your email</h1>
    <p class="sub" id="verify-sub">We sent a code to your email.</p>
    <form data-form="verify">
      <input class="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" aria-label="Verification code" required>
      <button class="primary" type="submit">Verify</button>
    </form>
    <p class="alt">No email? <button class="link" id="resend">Send a new code</button></p>
  </section>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<div id="app">
  <aside>
    <div class="brand"><img src="logo.png" alt=""><span>next</span></div>
    <button class="nav" id="nav-dash"><img src="icon-dash.png" alt=""><span>Dashboard</span></button>
  </aside>

  <div class="tools">
    <div class="search" id="search">
      <input id="q" type="text" placeholder="Suchen…" autocomplete="off" aria-label="Suchen">
      <button class="icon-btn" id="search-btn" aria-label="Suchen"><img src="icon-search.png" alt=""></button>
      <div class="pop" id="suggest" hidden></div>
    </div>
    <div class="wrap">
      <button class="icon-btn" id="bell" aria-label="Benachrichtigungen"><img src="icon-bell.png" alt=""><span class="dot" id="dot" hidden></span></button>
      <div class="pop" id="bell-pop" hidden></div>
    </div>
    <div class="wrap">
      <button class="avatar" id="avatar" aria-label="Profil"></button>
      <div class="pop" id="menu" hidden>
        <div class="who"><b id="who-name"></b><span id="who-mail"></span></div>
        <button class="row" id="logout">Abmelden</button>
      </div>
    </div>
  </div>

  <div class="content">
    <h2 class="greet" id="greet"></h2>
    <p class="hint">Dein Dashboard ist bereit.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://nrolzalmkculsjdulzyf.supabase.co";
const SUPABASE_KEY = "sb_publishable_3b7cEJ4D5_YqiS-ajaxglQ_WX_48VwQ";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const msg = $('#msg');
let pendingEmail = '', currentUser = null, greetTimer = null;
const notes = []; // später: { text, read:false } – sobald etwas passiert, erscheint der Punkt an der Glocke

/* ---------- Login ---------- */
function show(id){
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== id);
  setMsg('');
  const first = $('#'+id+' input'); if(first) first.focus();
}
function setMsg(t, ok){ msg.textContent = t; msg.className = 'msg' + (ok ? ' ok' : ''); }
function showVerify(email){
  pendingEmail = email;
  $('#verify-sub').textContent = 'We sent a code to ' + email + '. Enter it below.';
  show('verify');
}
async function busy(form, fn){
  const b = form.querySelector('button[type=submit]'); b.disabled = true;
  try { await fn(); } catch(e){ setMsg(e.message || 'Something went wrong. Try again.'); }
  b.disabled = false;
}
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => show(b.dataset.go));

document.querySelector('[data-form=register]').onsubmit = e => {
  e.preventDefault(); const f = e.target;
  busy(f, async () => {
    const email = f.email.value.trim();
    const { data, error } = await sb.auth.signUp({ email, password: f.password.value });
    if (error) return setMsg(error.message);
    if (data.user && data.user.identities && data.user.identities.length === 0)
      return setMsg('This email is already registered. Log in instead.');
    showVerify(email);
  });
};
document.querySelector('[data-form=login]').onsubmit = e => {
  e.preventDefault(); const f = e.target;
  busy(f, async () => {
    const email = f.email.value.trim();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: f.password.value });
    if (error) {
      if (/not confirmed/i.test(error.message)) {
        await sb.auth.resend({ type: 'signup', email });
        showVerify(email); return setMsg('Please verify your email first. We sent a new code.', true);
      }
      return setMsg(error.message);
    }
    showApp(data.user);
  });
};
document.querySelector('[data-form=verify]').onsubmit = e => {
  e.preventDefault(); const f = e.target;
  busy(f, async () => {
    const { data, error } = await sb.auth.verifyOtp({ email: pendingEmail, token: f.code.value.trim(), type: 'signup' });
    if (error) return setMsg('That code is wrong or expired. Check it or request a new one.');
    showApp(data.user);
  });
};
$('#resend').onclick = async () => {
  const { error } = await sb.auth.resend({ type: 'signup', email: pendingEmail });
  setMsg(error ? error.message : 'New code sent.', !error);
};
document.querySelectorAll('[data-oauth]').forEach(b => b.onclick = async () => {
  const { error } = await sb.auth.signInWithOAuth({ provider: b.dataset.oauth, options: { redirectTo: location.origin + location.pathname } });
  if (error) setMsg(error.message);
});

/* ---------- App ---------- */
function displayName(u){
  const m = u.user_metadata || {};
  let n = (m.full_name || m.name || (u.email || '').split('@')[0] || '').trim().split(/\s+/)[0];
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : 'du';
}
function renderGreeting(){
  const h = new Date().getHours(), n = displayName(currentUser);
  let pre, post = '!';
  if (h >= 5 && h < 11) pre = 'Guten Morgen, ';
  else if (h >= 11 && h < 17) pre = 'Hallo, ';
  else if (h >= 17 && h < 23) pre = 'Schönen Abend, ';
  else { pre = 'Noch wach, '; post = '?'; }
  const g = $('#greet'); g.textContent = pre;
  const s = document.createElement('span'); s.className = 'name'; s.textContent = n;
  g.append(s, post);
}
function showApp(user){
  currentUser = user;
  document.body.classList.add('in');
  const m = user.user_metadata || {}, av = $('#avatar');
  av.textContent = '';
  if (m.avatar_url || m.picture) { const i = document.createElement('img'); i.src = m.avatar_url || m.picture; i.alt = ''; i.referrerPolicy = 'no-referrer'; av.append(i); }
  else av.textContent = displayName(user).charAt(0).toUpperCase();
  $('#who-name').textContent = displayName(user);
  $('#who-mail').textContent = user.email || '';
  renderGreeting(); renderNotes();
  clearInterval(greetTimer); greetTimer = setInterval(renderGreeting, 60000);
}
function showLogin(){
  document.body.classList.remove('in'); clearInterval(greetTimer); show('login');
}

/* Popups */
const pops = { bell: $('#bell-pop'), menu: $('#menu') };
function togglePop(name){
  Object.keys(pops).forEach(k => pops[k].hidden = k === name ? !pops[k].hidden : true);
}
document.addEventListener('click', e => {
  if (!e.target.closest('.wrap')) Object.values(pops).forEach(p => p.hidden = true);
  if (!e.target.closest('.search')) closeSuggest();
});
$('#bell').onclick = () => { togglePop('bell'); notes.forEach(n => n.read = true); renderNotes(true); };
$('#avatar').onclick = () => togglePop('menu');
$('#logout').onclick = async () => { await sb.auth.signOut(); showLogin(); };
function renderNotes(keepOpen){
  $('#dot').hidden = !notes.some(n => !n.read);
  const p = $('#bell-pop'); p.textContent = '';
  if (!notes.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nichts Neues.'; p.append(d); }
  notes.forEach(n => { const d = document.createElement('div'); d.className = 'who'; d.textContent = n.text; p.append(d); });
}
$('#nav-dash').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

/* Suche */
const items = [
  { t: 'Dashboard',          k: 'dashboard start übersicht home hi begrüßung', run: () => window.scrollTo({ top: 0, behavior: 'smooth' }) },
  { t: 'Benachrichtigungen', k: 'benachrichtigungen glocke neuigkeiten news mitteilungen', run: () => { pops.menu.hidden = true; pops.bell.hidden = false; } },
  { t: 'Profil',             k: 'profil konto account name e-mail email bild avatar', run: () => { pops.bell.hidden = true; pops.menu.hidden = false; } },
  { t: 'Abmelden',           k: 'abmelden ausloggen logout beenden', run: () => $('#logout').click() }
];
const sug = $('#suggest'), q = $('#q'), box = $('#search');
function score(it, term){
  const t = it.t.toLowerCase();
  if (t.startsWith(term)) return 3;
  if (t.includes(term)) return 2;
  return it.k.split(' ').some(w => w.startsWith(term)) ? 1 : (it.k.includes(term) ? .5 : 0);
}
function closeSuggest(){ sug.hidden = true; box.classList.toggle('keep', !!q.value.trim()); }
function renderSuggest(){
  const term = q.value.trim().toLowerCase();
  box.classList.toggle('keep', !!term);
  sug.textContent = '';
  if (!term) { sug.hidden = true; return; }
  const hits = items.map(it => ({ it, s: score(it, term) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 3);
  if (!hits.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Keine Treffer.'; sug.append(d); }
  hits.forEach(({ it }) => {
    const b = document.createElement('button'); b.className = 'row'; b.textContent = it.t;
    b.onclick = () => { it.run(); q.value = ''; q.blur(); sug.hidden = true; box.classList.remove('keep'); };
    sug.append(b);
  });
  sug.hidden = false;
}
q.addEventListener('input', renderSuggest);
q.addEventListener('focus', renderSuggest);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const f = sug.querySelector('.row'); if (f) f.click(); }
  if (e.key === 'Escape') { q.value = ''; renderSuggest(); q.blur(); }
});
$('#search-btn').onclick = () => q.focus();

/* Kopier- und Ziehschutz (Eingabefelder bleiben nutzbar) */
const inField = e => e.target.closest && e.target.closest('input');
['contextmenu','dragstart','selectstart','copy','cut'].forEach(ev =>
  document.addEventListener(ev, e => { if (!inField(e)) e.preventDefault(); }));
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['c','x','s','u','p','a'].includes(k) && !inField(e)) e.preventDefault();
});

sb.auth.getSession().then(({ data }) => { if (data.session) showApp(data.session.user); });
</script>
</body>
</html>
