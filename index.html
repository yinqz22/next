<!DOCTYPE html>
<html lang="de" dir="ltr" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>next</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">

<!-- Theme sofort anwenden (verhindert Aufblitzen beim Laden) -->
<script>
(function(){
  var KEY = 'next.prefs';
  var DEF = { theme:'dark', custom:false, main:'#0f1623', second:'#8ec0ff', lang:'de', emailVisible:false };
  var HEX = /^#[0-9a-f]{6}$/i;
  function lumi(h){
    var m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return 0;
    var n = parseInt(m[1], 16);
    function f(c){ c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }
    return .2126 * f(n >> 16) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);
  }
  window.Prefs = {
    DEF: DEF, lumi: lumi,
    clean: function(p){
      var o = Object.assign({}, DEF, p || {});
      if (['light','dark','system'].indexOf(o.theme) < 0) o.theme = DEF.theme;
      if (!HEX.test(o.main)) o.main = DEF.main;
      if (!HEX.test(o.second)) o.second = DEF.second;
      if (['de','en','ar'].indexOf(o.lang) < 0) o.lang = DEF.lang;
      o.custom = !!o.custom; o.emailVisible = !!o.emailVisible;
      return o;
    },
    load: function(){ try { return this.clean(JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e){ return this.clean(); } },
    store: function(p){ try { localStorage.setItem(KEY, JSON.stringify(p)); } catch(e){} },
    apply: function(p){
      var r = document.documentElement, props = ['--bg','--text','--accent','--accent-ink'];
      if (p.custom) {
        var scheme = lumi(p.main) > .4 ? 'light' : 'dark';
        r.dataset.scheme = scheme; r.dataset.custom = '1';
        r.style.setProperty('--bg', p.main);
        r.style.setProperty('--text', scheme === 'light' ? '#15161a' : '#f4f4f5');
        r.style.setProperty('--accent', p.second);
        r.style.setProperty('--accent-ink', lumi(p.second) > .42 ? '#0b0b0d' : '#ffffff');
      } else {
        delete r.dataset.custom;
        props.forEach(function(k){ r.style.removeProperty(k); });
        r.dataset.scheme = p.theme === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p.theme;
      }
    }
  };
  var p = Prefs.load();
  Prefs.apply(p);
  document.documentElement.lang = p.lang;
  document.documentElement.dir = p.lang === 'ar' ? 'rtl' : 'ltr';
})();
</script>

<style>
:root{
  --bg:#0b0b0d; --text:#f4f4f5; --accent:#8ec0ff; --accent-ink:#0b0b0d; --err:#ff7a7a;
  --panel:color-mix(in srgb,var(--bg),var(--text) 6%);
  --frame:color-mix(in srgb,var(--bg),var(--text) 3%);
  --line:color-mix(in srgb,var(--bg),var(--text) 14%);
  --muted:color-mix(in srgb,var(--text),var(--bg) 45%);
  --hover:color-mix(in srgb,var(--bg),var(--text) 9%);
  --pop:color-mix(in srgb,var(--bg),var(--text) 8%);
  --shadow:0 16px 36px rgba(0,0,0,.35);
  --icon-filter:none; --icon-active-filter:invert(1);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-scheme=light]{--icon-filter:invert(1);--icon-active-filter:none;--shadow:0 14px 32px rgba(20,24,40,.14);color-scheme:light}
:root[data-scheme=light]:not([data-custom]){--bg:#f1f2f6;--text:#15161a;--accent:#4a8df0;--accent-ink:#fff;--panel:#fff;--frame:#f8f9fc}

*{box-sizing:border-box}
html{font-size:14px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Bricolage Grotesque','Noto Sans Arabic',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:24px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;transition:background-color .35s,color .35s}
input{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- login ---------- */
main{width:100%;max-width:370px;text-align:center}
.logo{width:60px;height:auto;display:block;margin:0 auto 24px;filter:var(--icon-filter)}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 24px;line-height:1.5}
form{display:grid;gap:11px;text-align:start}
label{font-size:.85rem;color:var(--muted)}
main input{width:100%;margin-top:6px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:1rem;transition:border-color .2s}
main input:focus{border-color:var(--accent);outline:none}
main input.code{text-align:center;font-size:1.6rem;font-weight:600;letter-spacing:.5em;padding-inline-start:calc(14px + .5em)}
button.primary{padding:12px 18px;border:0;border-radius:12px;background:var(--text);color:var(--bg);font-weight:600;font-size:1rem;cursor:pointer;transition:transform .15s var(--ease),opacity .2s,background .2s}
button.primary:hover{opacity:.9}
button.primary:active{transform:scale(.98)}
button.primary:disabled{opacity:.5;cursor:wait}
button.primary.danger{background:var(--err);color:#1a0606}
form button.primary{margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
button.oauth{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:1rem;cursor:pointer;transition:border-color .2s,transform .15s var(--ease)}
button.oauth:hover{border-color:color-mix(in srgb,var(--line),var(--text) 30%)}
button.oauth:active{transform:scale(.99)}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;color:var(--accent)}
.alt{margin-top:20px;color:var(--muted);font-size:.93rem}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.9rem;color:var(--err)}
.msg.ok{color:var(--text)}

/* ---------- app shell ---------- */
#app{display:none}
body.in{display:block;padding:0;overflow:hidden}
body.in main{display:none}
body.in #app{display:block}
.frame{position:fixed;inset:14px;border:1px solid var(--line);border-radius:28px;background:var(--frame);overflow:hidden;transition:background-color .35s,border-color .35s}
aside{position:absolute;inset-inline-start:12px;top:12px;bottom:12px;width:200px;padding:20px 12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;z-index:4;transition:background-color .35s,border-color .35s}
.brand{display:flex;align-items:center;gap:9px;width:100%;padding:2px 8px 24px;border:0;background:none;font-size:1.45rem;font-weight:800;letter-spacing:-.03em;text-align:start;cursor:pointer}
.brand img{width:23px;height:auto;filter:var(--icon-filter);transition:transform .45s var(--ease)}
.brand:hover img{transform:rotate(-8deg) scale(1.08)}
.navs{position:relative;display:grid;gap:4px}
.pill{position:absolute;inset-inline:0;top:0;height:0;border-radius:13px;background:var(--text);transition:none;pointer-events:none}
.pill.ready{transition:transform .4s var(--ease),height .3s var(--ease),background-color .35s}
.nav{position:relative;z-index:1;display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border:0;border-radius:13px;background:transparent;font-size:.93rem;font-weight:600;text-align:start;cursor:pointer;transition:color .3s,background-color .2s}
.nav img{width:17px;height:17px;object-fit:contain;filter:var(--icon-filter);transition:filter .3s}
.nav:not(.active):hover{background:var(--hover)}
.nav.active{color:var(--bg)}
.nav.active img{filter:var(--icon-active-filter)}

.scroll{position:absolute;inset-block:0;inset-inline-start:224px;inset-inline-end:0;overflow:auto;padding-block:22px 50px;padding-inline:8px 26px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--text),transparent 80%) transparent}
.greet{margin:0;font-size:clamp(1.4rem,2.4vw,1.9rem);font-weight:800;letter-spacing:-.03em;line-height:38px}
.greet .name{color:var(--accent)}

/* Tab-Wechsel */
.view.enter>*{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
.view.leave{opacity:0;transform:translateY(8px);transition:opacity .16s ease,transform .16s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ---------- top tools ---------- */
.tools{position:absolute;top:22px;inset-inline-end:24px;display:flex;align-items:center;gap:10px;z-index:6}
.icon-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer;flex:none}
.icon-btn img{width:18px;height:18px;object-fit:contain;filter:var(--icon-filter)}
.circle{background:var(--hover);border:1px solid var(--line);transition:background-color .2s,transform .15s var(--ease)}
.circle:hover{background:color-mix(in srgb,var(--hover),var(--text) 8%)}
.circle:active{transform:scale(.94)}
.dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel);animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(0)}}
.avatar{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--hover);display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer;font-weight:800;font-size:.95rem;flex:none;transition:transform .15s var(--ease)}
.avatar:active{transform:scale(.94)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.big{width:64px;height:64px;font-size:1.4rem}
.search{position:relative;display:flex;align-items:center;justify-content:flex-end;height:38px;width:38px;border-radius:19px;border:1px solid var(--line);background:var(--hover);transition:width .4s var(--ease),background-color .3s}
.search:hover,.search:focus-within,.search.keep{width:min(260px,calc(100vw - 250px));background:color-mix(in srgb,var(--hover),var(--text) 6%)}
.search input{flex:1;min-width:0;width:auto;margin:0;padding:0 4px;padding-inline-start:16px;height:36px;background:transparent;border:0;border-radius:0;font-size:.93rem;opacity:0;pointer-events:none;transition:opacity .25s}
.search:hover input,.search:focus-within input,.search.keep input{opacity:1;pointer-events:auto}
.search input:focus-visible{outline:none}
.search .icon-btn{margin:-1px}

.pop{position:absolute;top:46px;inset-inline-end:0;min-width:220px;padding:6px;background:var(--pop);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-6px) scale(.97);transform-origin:top right;transition:opacity .18s,transform .24s var(--ease),visibility .18s}
[dir=rtl] .pop{transform-origin:top left}
.pop.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.search .pop{width:100%;min-width:0}
.pop .row{display:block;width:100%;padding:9px 11px;border:0;border-radius:11px;background:none;text-align:start;cursor:pointer;font-size:.93rem;transition:background-color .15s}
.pop .row:hover{background:var(--hover)}
.pop .row.danger{color:var(--err)}
.pop .empty,.pop .who{padding:9px 11px;color:var(--muted);font-size:.88rem}
.pop .who b{display:block;color:var(--text);font-size:.98rem}
.pop .sep{height:1px;background:var(--line);margin:5px 4px}
.wrap{position:relative}

/* ---------- settings ---------- */
.cards{display:grid;gap:14px;margin-top:22px;max-width:680px}
.card{position:relative;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;transition:background-color .35s,border-color .35s}
.card:has(.dd.open){z-index:5}
.card h3{margin:0 0 14px;font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.hint{margin:-8px 0 14px;color:var(--muted);font-size:.88rem;line-height:1.45}
.field{display:grid;gap:6px;margin-top:14px}
.field:first-of-type{margin-top:0}
.profile-row{display:flex;align-items:center;gap:14px}
.inp,.secret{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 6px 0 14px;padding-inline:14px 6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:.95rem;transition:border-color .2s}
input.inp{padding-inline:14px}
.inp:focus,.secret:focus-within{border-color:var(--accent);outline:none}
.secret input{flex:1;min-width:0;height:40px;margin:0;padding:0;border:0;background:transparent;font-size:.95rem}
.secret input:focus-visible{outline:none}
.secret .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.reveal{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;flex:none;transition:color .2s,background-color .2s}
.reveal:hover{color:var(--text);background:var(--hover)}
.reveal .slash{stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .3s var(--ease)}
.reveal[aria-pressed=true]{color:var(--accent)}
.reveal[aria-pressed=true] .slash{stroke-dashoffset:1}

button.ghost,button.danger-ghost{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:.93rem;cursor:pointer;transition:background-color .2s,border-color .2s,transform .15s var(--ease)}
button.ghost:hover{background:var(--hover)}
button.ghost:active,button.danger-ghost:active{transform:scale(.97)}
button.danger-ghost{color:var(--err);border-color:color-mix(in srgb,var(--err),transparent 60%)}
button.danger-ghost:hover{background:color-mix(in srgb,var(--err),transparent 90%)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

.lock{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.9rem}
.lock .l{display:flex;align-items:center;gap:8px}
.lock b{color:var(--text);font-weight:600}

.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;transition:opacity .3s}
.seg.off{opacity:.4;pointer-events:none}
.seg-thumb{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--text);transform:translateX(calc(var(--i,0)*100%));transition:transform .4s var(--ease),background-color .35s}
[dir=rtl] .seg-thumb{transform:translateX(calc(var(--i,0)*-100%))}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:.9rem;cursor:pointer;transition:color .3s}
.seg button.on{color:var(--bg)}
.seg button img{width:18px;height:18px;object-fit:contain;filter:var(--icon-filter);transition:filter .3s}
.seg button.on img{filter:var(--icon-active-filter)}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.between .tt{display:grid;gap:2px}
.between .tt small{color:var(--muted);font-size:.85rem}
.switch{width:44px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer;flex:none;padding:0;transition:background-color .25s,border-color .25s}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .3s var(--ease),background-color .25s}
.switch[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(18px);background:var(--accent-ink)}
[dir=rtl] .switch[aria-checked=true]::after{transform:translateX(-18px)}
.collapse{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s var(--ease),opacity .3s}
.collapse.open{grid-template-rows:1fr;opacity:1}
.collapse>div{overflow:hidden}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:14px}
.color{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer}
.color span{display:grid;gap:1px;font-size:.88rem;color:var(--muted)}
.color small{color:var(--text);font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:start}
.color input{width:30px;height:30px;padding:0;margin:0;border:0;background:none;border-radius:50%;cursor:pointer;flex:none}
.color input::-webkit-color-swatch-wrapper{padding:0}
.color input::-webkit-color-swatch{border:1px solid var(--line);border-radius:50%}
.color input::-moz-color-swatch{border:1px solid var(--line);border-radius:50%}

.savebar{position:sticky;bottom:6px;display:flex;justify-content:flex-end;z-index:3}
.savebar .primary{box-shadow:var(--shadow)}

/* ---------- Custom Dropdown (wiederverwendbar) ---------- */
.dd{position:relative}
.dd.open{z-index:30}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;height:42px;padding:0 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:.95rem;text-align:start;transition:border-color .2s}
.dd-btn:hover,.dd.open .dd-btn{border-color:color-mix(in srgb,var(--line),var(--text) 30%)}
.dd-btn svg{flex:none;color:var(--muted);transition:transform .3s var(--ease)}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-list{position:absolute;inset-inline:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--pop);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top;transition:opacity .18s,transform .25s var(--ease),visibility .18s}
.dd.open .dd-list{opacity:1;visibility:visible;transform:none}
.dd-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:.93rem;transition:background-color .15s}
.dd-list li:hover,.dd-list li.hl{background:var(--hover)}
.dd-list li[aria-selected=true]{color:var(--accent);font-weight:600}
.dd-list li[aria-selected=true]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- Dialog + Toast ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.overlay.open{opacity:1;visibility:visible}
.dialog{width:100%;max-width:380px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transform:translateY(14px) scale(.96);transition:transform .32s var(--ease)}
.overlay.open .dialog{transform:none}
.dialog h3{margin:0 0 8px;font-size:1.15rem}
.dialog p{margin:0 0 16px;color:var(--muted);line-height:1.5;font-size:.93rem}
.dialog .inp{padding-inline:14px}
.dlg-err{min-height:1.3em;margin:8px 0 0!important;color:var(--err)!important;font-size:.88rem!important}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.toast{position:fixed;bottom:30px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;padding:11px 18px;background:var(--text);color:var(--bg);border-radius:14px;font-weight:600;font-size:.93rem;box-shadow:var(--shadow);opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .25s,transform .35s var(--ease),visibility .25s;z-index:60}
.toast.show{opacity:1;visibility:visible;transform:none}
.toast.bad{background:var(--err);color:#1a0606}

@media (max-width:760px){
  .frame{inset:8px;border-radius:24px}
  aside{inset-inline-start:8px;top:8px;bottom:8px;width:58px;padding:16px 7px;border-radius:19px}
  .brand span,.nav span{display:none}
  .brand{padding:2px 7px 20px}
  .nav{justify-content:center;padding:11px 0}
  .scroll{inset-inline-start:74px;padding-block:20px 40px;padding-inline:6px 14px}
  .tools{inset-inline-end:12px;top:20px;gap:7px}
  .search:hover,.search:focus-within,.search.keep{width:min(220px,calc(100vw - 215px))}
  .colors{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){main>section:not([hidden]){animation:rise .35s var(--ease)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="next logo">

  <section id="login">
    <h1 data-i18n="log_in"></h1>
    <p class="sub" data-i18n="welcome"></p>
    <form data-form="login">
      <label><span data-i18n="email"></span><input type="email" name="email" autocomplete="email" required></label>
      <label><span data-i18n="password"></span><input type="password" name="password" autocomplete="current-password" required></label>

const sug = $('#suggest'), q = $('#q'), box = $('#search');
function score(it, term){
  const tt = it.t.toLowerCase();
  if (tt.startsWith(term)) return 3;
  if (tt.includes(term)) return 2;
  return it.k.split(' ').some(w => w.startsWith(term)) ? 1 : (it.k.includes(term) ? .5 : 0);
}
function closeSuggest(){ sug.classList.remove('open'); box.classList.toggle('keep', !!q.value.trim()); }
function renderSuggest(){
  const term = q.value.trim().toLowerCase();
  box.classList.toggle('keep', !!term);
  sug.textContent = '';
  if (!term) { sug.classList.remove('open'); return; }
  const hits = getItems().map(it => ({ it, s: score(it, term) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 4);
  if (!hits.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = t('no_hits'); sug.append(d); }
  hits.forEach(({ it }) => {
    const b = document.createElement('button'); b.className = 'row'; b.textContent = it.t;
    b.onclick = () => { q.value = ''; q.blur(); sug.classList.remove('open'); box.classList.remove('keep'); it.run(); };
    sug.append(b);
  });
  sug.classList.add('open');
}

/* ---------- Custom Dropdown (wiederverwendbar) ---------- */
function closeAllDd(){ document.querySelectorAll('.dd.open').forEach(d => d._dd && d._dd.close()); }
function createDropdown(root, options, value, onChange){
  root.innerHTML = '<button type="button" class="dd-btn" aria-haspopup="listbox" aria-expanded="false"><span class="dd-val"></span>' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>' +
    '<ul class="dd-list" role="listbox" tabindex="-1"></ul>';
  const btn = root.querySelector('.dd-btn'), val = root.querySelector('.dd-val'), list = root.querySelector('.dd-list');
  let cur = value, hl = -1;
  const label = o => o.key ? t(o.key) : o.label;
  function render(){
    list.textContent = '';
    options.forEach((o, i) => {
      const li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', String(o.value === cur));
      li.dataset.i = i; li.textContent = label(o);
      list.append(li);
    });
    val.textContent = label(options.find(o => o.value === cur) || options[0]);
  }
  function mark(){ [...list.children].forEach((li, i) => li.classList.toggle('hl', i === hl)); }
  function open(on){
    root.classList.toggle('open', on); btn.setAttribute('aria-expanded', String(on));
    if (on) { hl = Math.max(0, options.findIndex(o => o.value === cur)); mark(); }
  }
  function pick(i){ cur = options[i].value; render(); open(false); btn.focus(); onChange(cur); }
  btn.onclick = () => { const was = root.classList.contains('open'); closeAllDd(); open(!was); };
  list.onclick = e => { const li = e.target.closest('li'); if (li) pick(+li.dataset.i); };
  list.onmousemove = e => { const li = e.target.closest('li'); if (li) { hl = +li.dataset.i; mark(); } };
  btn.onkeydown = e => {
    const isOpen = root.classList.contains('open');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!isOpen) { closeAllDd(); open(true); }
      else { hl = (hl + (e.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length; mark(); }
    } else if (e.key === 'Home' && isOpen) { e.preventDefault(); hl = 0; mark(); }
    else if (e.key === 'End' && isOpen) { e.preventDefault(); hl = options.length - 1; mark(); }
    else if ((e.key === 'Enter' || e.key === ' ') && isOpen) { e.preventDefault(); if (hl >= 0) pick(hl); }
    else if (e.key === 'Escape' && isOpen) { e.preventDefault(); e.stopPropagation(); open(false); }
  };
  render();
  const api = { set(v){ cur = v; render(); }, refresh: render, close: () => open(false) };
  root._dd = api;
  return api;
}

async function resizeImage(file, size = 256){
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', .88));
}

    else {
      currentUser = data.user;
      if (pendingUrl) URL.revokeObjectURL(pendingUrl);
      pendingAvatar = null; pendingUrl = null;
      saved = { ...prefsOnly(draft), name }; draft = { ...saved };
      Prefs.store(prefsOnly(saved));
      refreshUserUI(); renderGreeting(); renderSettings();
      toast(avatarFailed ? t('avatar_failed') : t('saved'), avatarFailed);
    }
  } catch(e){ toast(e.message || t('generic_err'), true); }
  btn.disabled = false;
};

/* ---------- Kopier- und Ziehschutz (Eingabefelder bleiben nutzbar) ---------- */
const inField = e => e.target.closest && e.target.closest('input');
['contextmenu','dragstart','selectstart','copy','cut'].forEach(ev =>
  document.addEventListener(ev, e => { if (!inField(e)) e.preventDefault(); }));
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['c','x','s','u','p','a'].includes(k) && !inField(e)) e.preventDefault();
});

/* ---------- Start ---------- */
applyI18n();
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && document.body.classList.contains('in')) showLogin(); });
sb.auth.getSession().then(({ data }) => { if (data.session) showApp(data.session.user); });
</script>
